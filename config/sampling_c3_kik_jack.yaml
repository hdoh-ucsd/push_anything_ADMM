  num_additional_samples_c3: 2
  num_additional_samples_repos: 1
  consider_best_buffer_sample_when_leaving_c3: true
  N_sample_buffer: 100
  pos_error_sample_retention: 0.005
  ang_error_sample_retention: 0.087
  sampling_radius: 0.1
  repos_target_radius: 0.1
  sampling_height: 0.069
  z_height: 0.024431815000000003
  use_adaptive_contact_height: false
  object_shape: jack
  box_half_extent: 0.0875
  sampling_setback: 0.02
  sample_reject_clearance: 0.005
  sample_projection_clearance: 0.008
  grid_x_limits:
  - -0.16
  - 0.16
  grid_y_limits:
  - -0.16
  - 0.16
  face_bias_strength: 0.0
  use_mesh_normal_area_weighting: true
  yaw_face_bias_strength: 500.0
  workspace_xy_min:
  - 0.15
  - -0.6
  workspace_xy_max:
  - 0.75
  - 0.6
  workspace_z_min: 0.019000000000000003
  workspace_z_max: 0.329
  robot_radius_limits:
  - 0.25
  - 0.75
