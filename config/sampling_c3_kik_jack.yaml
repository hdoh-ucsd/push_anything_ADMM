#
# reposition_params.traj_type: kSpherical -- jacktoy's traj_type 1. The EE
# joins a sphere of radius `sphere_radius` (0.12 m) centred on the OBJECT,
# arcs around it to the target's bearing, then leaves for the target
# (reference reposition.cc RepositionSpherical). This is not cosmetic: the
# jack stands 0.122 m tall, so the piecewise-linear traverse at
# pwl_waypoint_height 0.06 passes within 3 mm of the jack's CENTRE -- the EE
# bulldozes the object across the table. Measured on the arc the closest
# approach is exactly 0.120 m, i.e. +32.5 mm clear of the jack's 0.0875 m tip
# reach. pwl_waypoint_height is retained below only because other traj_types
# read it; kSpherical never does.
# =====================================================================
# sampling_c3_kik_jack.yaml — controller config for the `push_jack` task.
#
# Derived from config/sampling_c3_kik_h.yaml (so the port-specific keys the
# H run established are inherited) with every value the reference specifies
# for the jack replaced from:
#     examples/sampling_c3/jacktoy/parameters/{sampling_params,
#         sampling_c3plus_options, progress_params_c3plus, reposition_params}.yaml
#
# Frame: reference ground top is z=-0.029, port ground is z=0. Every z below
# is the reference value + 0.029.
#
# THE SE(3) TASK. Two entries deserve attention:
#   sampling_strategy: kRandomOnSphere -- the jack is sampled on a SPHERE
#     around the object (elevation band 0.2..1.95 rad from vertical), not on a
#     perimeter at a fixed height. It has no flat face and no outline to
#     project onto, so the face-table samplers the box/T/H use do not apply.
#   lcs_explicit_manipuland_ground_contacts: 3 -- from resolve_contacts_to
# Cost-LCS contact resolution [EE-ground, EE-object, object-ground].
# Reference jacktoy/parameters/sampling_c3plus_options.yaml
# num_contacts_index_for_cost: 5 -> [0, 3, 6].
# ALL six jack tips + all three capsules. The planner keeps the closest 1
  # EE-capsule and closest 3 tips; the ranking rollout selects nothing, so
  # the LCP -- not a pose-dependent guess -- decides which tips carry load.
  # This is what lets sample ranking see a tip-over coming.
# Predicted-x0 mechanism. jacktoy/parameters/sampling_c3plus_options.yaml
# sets all three true; `nominal_ee_accel` is omitted there (push_t and anything
# use 2). The RESET is what the port was missing: without it the reposition
# trajectory is rebuilt from a predicted EE each tick with no correction when
# the prediction goes bad, so it becomes a receding start point. p167 diverged
# 0.024 -> 0.360 m from a STATIONARY target in 3 ticks and left the workspace.
use_predicted_x0_c3: true
use_predicted_x0_repos: true
use_predicted_x0_reset_mechanism: true
nominal_ee_accel: 2.0
x_pred_reset_threshold: 0.01   # reference hardcodes 0.01 m

resolve_contacts_to_for_cost: [0, 3, 6]
#     [0, 1, 3] (0 EE-ground, 1 EE-object, 3 object-ground). Unlike the T/H,
#     WHICH three witnesses these are changes every tick: the LCS formulator
#     enumerates all six capsule tips and keeps the closest three, mirroring
#     the reference's GetNClosestContactPairs over its six explicit tip
#     spheres (jack_control.sdf / franka_sampling_c3_controller.cc:193-204).
#
# CAVEAT: jacktoy's reference param files do not set `lcs_dt_resolution` at
# all, while push_t and anything both set 4 -- the jacktoy config predates
# that field in this snapshot. 4 is used here, matching both maintained tasks.
# =====================================================================
w_align: 0.0
w_travel: 0.0
planner_workspace_x:
- 0.15
- 0.75
planner_workspace_y:
- -0.6
- 0.6
planner_workspace_z:
- 0.019000000000000003
- 0.329
planner_workspace_margin: 0.02
W_force: 1.0
use_commit_face_gate: false
use_contact_entry_gate: false
use_surface_entry_gate: false
ee_z_close: true
use_reposition_pwl_trajectory: true
w_rot: 0.0
surrogate_admm_iters: 3
# Per-task ADMM solver scales — 2026-08-16 contact-latch regression fix.
# Reference jacktoy/parameters/sampling_c3plus_options.yaml pins
# u_lambda_list = uniform 4 (:192-199) and w_G = 0.03 (:73); the port's
# class defaults are the anything-N1 literals (1000 / 0.18, L3 @3202fbe)
# which flipped the jack's C3+ projection to ~90% λ-endorsement and
# published standoff plans (no final-QP boost exists for jacktoy — the
# reference key is anything-only, so do NOT add it here). Falsified
# 2026-08-16: HEAD + these values re-latches contact (jack_headscales).
u_lambda: 4.0
w_G: 0.03
u_horizontal_limit: 50.0
u_vertical_limit: 50.0
lcs_explicit_manipuland_ground_contacts: 3
use_reference_pair_admission_planner_lcs: true
use_cost_lcs_ranking: true
# Reference jacktoy progress_params_c3plus.yaml:18 cost_type: 3
# (kSimImpedance): the ranking rollout is scored with the FULL Q and R —
# unlike push_t/anything/H, which use 5 (kSimImpedanceObjectCostOnly).
cost_type: 3
Kp_for_ee_pd_rollout: 100.0
Kd_for_ee_pd_rollout: 0.5
lcs_dt_resolution: 4
dt_osc: 0.01
dt_mpc: 0.01
entry_align_threshold: 0.0
progress_params:
  track_c3_progress_via: kConfigCostDrop
  num_control_loops_to_wait_loops: 14
  num_control_loops_to_wait_position_loops: 20
  pos_regression_threshold: 0.0
  progress_enforced_cost_drop: 0.015
  progress_enforced_over_n_loops_ref: 40
  cost_switching_threshold_distance: 0.5
  finished_reposition_cost: 1000000000.0
  hyst_c3_to_repos: 300000.0
  hyst_c3_to_repos_position: 300000.0
  hyst_repos_to_c3: 200000.0
  hyst_repos_to_c3_position: 200000.0
  hyst_repos_to_repos: 60000000000000.0
  hyst_repos_to_repos_position: 60000000000000.0
  use_relative_hysteresis: true
  hyst_c3_to_repos_frac: 0.85
  hyst_c3_to_repos_frac_position: 0.6
  hyst_repos_to_c3_frac: 0.3
  hyst_repos_to_c3_frac_position: 0.5
  hyst_repos_to_repos_frac: 0.1
  hyst_repos_to_repos_frac_position: 0.1
  watchdog_steps_since_improve_threshold: 0
sampling_params:
  sampling_strategy: kRandomOnSphere
  num_additional_samples_c3: 2
  num_additional_samples_repos: 1
  consider_best_buffer_sample_when_leaving_c3: true
  N_sample_buffer: 100
  pos_error_sample_retention: 0.005
  ang_error_sample_retention: 0.087
  sampling_radius: 0.1
  repos_target_radius: 0.1
  sampling_height: 0.069
  z_height: 0.024431815000000003
  use_adaptive_contact_height: false
  object_shape: jack
  box_half_extent: 0.0875
  sampling_setback: 0.02
  sample_reject_clearance: 0.005
  sample_projection_clearance: 0.008
  grid_x_limits:
  - -0.16
  - 0.16
  grid_y_limits:
  - -0.16
  - 0.16
  face_bias_strength: 0.0
  use_mesh_normal_area_weighting: true
  yaw_face_bias_strength: 500.0
  workspace_xy_min:
  - 0.15
  - -0.6
  workspace_xy_max:
  - 0.75
  - 0.6
  workspace_z_min: 0.019000000000000003
  workspace_z_max: 0.329
  robot_radius_limits:
  - 0.25
  - 0.75
  workspace_margins: 0.02
  strict_workspace: true
  filter_samples_for_safety: true
  min_angle_from_vertical: 0.2
  max_angle_from_vertical: 1.95
reposition_params:
  traj_type: kSpherical
  speed: 0.2
  use_straight_line_traj_under_piecewise_linear: 0.008
  pwl_waypoint_height: 0.06
  pwl_speed: 0.18
  use_straight_line_traj_under_spline: 0.12
  use_straight_line_traj_within_angle: 0.3
  spline_width: 0.17
  sphere_radius: 0.12
  circle_radius: 0.2
  circle_height: 0.0
  Kp_q: 60.0
  Kd_q: 8.0
  Ki_q: 8.0
  I_max: 4.0
  torque_limit: 87.0
# 2026-08-10: OFF, matching push_t and the reference.
# _velocity_feedforward_from_xseq injects the planner's EE VELOCITY STATE
# slots (x_seq[1][16:19]). The reference's ydot_des is
# traj.EvalDerivative(t,1) -- the derivative of the POSITION knot track,
# which compute_torque_from_trajectory already derives from _traj_c3. Those
# differ here because c3 mode FREEZES the trajectory's z to z_height
# (sampling_based_c3_controller.py:4241 `_knots[2,:] = _sh_c3`): the frozen
# track has zero z-derivative, but the planner's velocity slot still carries
# its intended descent. The OSC then gets a frozen z target fighting a
# downward z velocity target and settles at
#     sag = (Kd_cart/Kp_cart) * |v_des_z| = 0.1 * 0.032 = 3.2 mm
# (measured 3.21 mm over 39 settled c3 steps, r=0.81, residual 0.35 mm).
# That eats the entire 5.4 mm margin between z_height 0.0244 and the
# workspace floor 0.019 and trips CheckForWorkspaceLimitViolations.
use_velocity_feedforward: false
velocity_feedforward_alpha: 1.0
velocity_feedforward_v_max: 1.5
