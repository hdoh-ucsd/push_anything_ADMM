tasks:
  # -----------------------------------------------------------------------
  # Task 1: Standard Pushing
  # -----------------------------------------------------------------------
  pushing:
    object_type: box
    link_name: box_link
    mass: 0.2
    friction: 0.3            # reference push_t.sdf mu_dynamic
    pusher_friction: 1.0     # reference end_effector_full.urdf mu
    size: [0.1, 0.1, 0.1]
    # 2026-08-11 box-lineage: planner-LCS mu from the authors' multiyaml
    # constants (hardcoded for EVERY anything object — same set the T runs).
    mu_per_pair_type:
      EE-BOX:  0.42
      BOX-GND: 0.46
      EE-GND:  0.823
    # Reference convention: ~1 kg CONTROLLER object model regardless of sim
    # mass (letters 0.05->1.0; the port's cube sims 0.2 kg).
    controller_mass: 1.0
    # 2026-08-14 joint2 fix: reference initial arm configuration
    # (anything/parameters/sim_params.yaml:13 q_init_franka, verbatim —
    # weld chain byte-identical per the 2026-07-28 mount close-out, so the
    # joint vector ports directly). joint2 starts AT the 1.1 rad pin target
    # so the restored w_elbow task (osc_franka.yaml W_joint2) is
    # transient-free. FK puts the EE at (0.327, 0.401, 0.102) ≈ the
    # retreat_ee_position (0.3, 0.4, 0.1), pointing down, 0.42 m clear of
    # the box spawn (verified collision-free 2026-08-14). Overrides the
    # port-only IK safe-offset preposition in compute_safe_init_arm_q.
    q_init_franka: [2.191, 1.1, -1.33, -2.22, 1.30, 2.02, 0.08]
    # 2026-07-28 frame migration: box spawns +x of the arm base
    # (reference layout, sampling_c3_utils.cc — object at (0.5,0)).
    # The old (0,0) init predated ed16080's base-at-origin move and
    # spawned the box INSIDE panda_link0 (sank through the table).
    # 2026-07-28b: pulled in 0.50 → 0.45 (user directive) — at 0.50 the
    # east-face reposition targets sit at x≈0.55+ where the arm
    # hover-stalls (p4 wrist-saturation deep-reach limit); at 0.45 the
    # far-face targets land near x≈0.50, inside the T-proven reach zone.
    init_xyz: [0.45, 0.0, 0.05]
    goal_xy:  [0.60, 0.0]
    goal_yaw: 0.0
    color_rgba: [0.8, 0.2, 0.2, 1.0]
    # 2026-07-17: lowered 0.064 → 0.050 (box COM height). Cube-specific
    # override of the +14 mm-above-link-origin geometry inherited from the
    # T reference (commit 618fb3e). Rationale: the cube's COM is at its
    # geometric center (world-z 0.050), so contact at 0.064 sits 14 mm above
    # COM and injects a forward-tumble torque on every push impulse (30 s
    # trace analysis showed box airborne up to 12 mm during productive
    # steps 88-168, [X-SEQ-PROBE] z-history in /tmp/hud_run.log). The T's
    # +14 mm inheritance was motivated by ROLLING-CONTACT stability on the T
    # crossbar, which doesn't apply to a cube where any above-COM contact
    # produces tumble regardless of push direction.
    # Combined with the 2026-07-17 kConfigCostDrop mode-switch fix
    # (sampling_c3_params.yaml:42), each repos cycle was RE-INJECTING tumble
    # torque; the 87-switch 30 s run tumbled 6.6° vs the pre-fix 0.6°.
    # This edit removes the tumble source at the contact geometry level;
    # z_ee_target below must track sampling_height (commit 4345950).
    # Reference-inherited value (0.064) preserved in git for the T config,
    # which uses `sampling_c3_kik_t.yaml` and its own sampling_height.
    sampling_height: 0.050
    # PWL waypoint height (sphere-center z) for over-box traverse. Box top
    # at z=0.10 (10 cm cube CoM at 0.05). Sphere-center at 0.135 puts
    # sphere-bottom 10 mm above box top for safe cross-over. Box-push
    # rarely needs over-object transit (side samples reachable without
    # cross-over) so a stricter clearance is fine here.
    pwl_waypoint_height: 0.135   # box top 0.10 + pusher r 0.025 + 10 mm margin
    cost:
      # 2026-08-11 box-lineage: the anything-N1 dual-regime reference cost
      # (same set the T runs — see push_t block for rationale). The legacy
      # w_obj_* keys below stay for the non-reference build() path only.
      use_reference_q_vector:  true
      w_Q:                    80.0
      w_Q_position:           50.0
      q_vector_ee_pos:        [0.01, 0.01, 0.01]
      q_vector_obj_quat:      [0.1, 0.1, 0.1, 0.1]
      q_vector_obj_pos:       [150.0, 150.0, 120.0]
      q_vector_position_obj_quat: [0.0, 0.0, 0.0, 0.0]
      q_vector_position_obj_pos:  [200.0, 200.0, 120.0]
      q_vector_ee_vel:        [15.0, 15.0, 10.0]
      q_vector_obj_ang_vel:   [0.05, 0.05, 0.05]
      q_vector_obj_lin_vel:   [0.05, 0.05, 0.05]
      w_R:                    6.0
      r_vector:               [0.01, 0.01, 1.0]
      use_quaternion_dependent_cost: true
      q_quaternion_dependent_weight: 1000.0
      ee_target_z_offset_above_object: 0.06
      w_obj_xy:    100000.0
      w_obj_z:         10.0
      w_box_z:        100.0
      w_box_rp:        50.0
      w_yaw:            0.0
      w_terminal:       1.0   # box-lineage: QN = Q (reference gamma=1; was 5.0)
      # z_ee_target: planner-cost proxy z (task_costs.py:349 proxy_3d.z
      # = self.z_ref). Must match sampling_height above so the planner
      # drives arm to the SAME z the reposition tracker + IK place it at.
      # Coupled with sampling_height edit above (2026-07-17: 0.064 →
      # 0.050 for cube-COM contact, no-tumble geometry).
      z_ee_target:      0.050
      d_push:           0.05
      w_ee_approach: 8000.0
      w_torque:         0.01
      # Near-goal (pose regime) overrides. Fire when the wrapper's
      # sticky `_crossed_switching_threshold` flag latches at
      # box-to-goal distance < cost_switching_threshold_distance (5 cm).
      # Ratios mirror reference push_t sampling_c3plus_options.yaml:
      #   position obj_pos = [250, 250, 250], pose obj_pos = [200, 200, 120]
      #   → 20 % xy reduction, 52 % z reduction near goal.
      w_obj_xy_pose: 80000.0    # 100k × 0.80
      w_box_z_pose:  48.0       # 100 × 0.48

  # -----------------------------------------------------------------------
  # Task 2: Hard Physics Pushing
  # -----------------------------------------------------------------------
  hard_pushing:
    object_type: box
    link_name: box_link
    mass: 1.5
    friction: 0.3
    pusher_friction: 1.0
    size: [0.1, 0.1, 0.1]
    # 2026-07-28 frame migration: box spawns +x of the arm base
    # (reference layout, sampling_c3_utils.cc — object at (0.5,0)).
    # The old (0,0) init predated ed16080's base-at-origin move and
    # spawned the box INSIDE panda_link0 (sank through the table).
    # 2026-07-28b: pulled in 0.50 → 0.45 (user directive) — at 0.50 the
    # east-face reposition targets sit at x≈0.55+ where the arm
    # hover-stalls (p4 wrist-saturation deep-reach limit); at 0.45 the
    # far-face targets land near x≈0.50, inside the T-proven reach zone.
    init_xyz: [0.45, 0.0, 0.05]
    goal_xy:  [0.60, 0.0]
    goal_yaw: 0.0
    color_rgba: [0.2, 0.2, 0.8, 1.0]
    # D6: sub-CoM push point — see pushing task block above for rationale.
    sampling_height: 0.03
    cost:
      w_obj_xy:    150000.0
      w_obj_z:         10.0
      w_box_z:        100.0
      w_box_rp:        50.0
      w_yaw:            0.0
      w_terminal:       8.0
      z_ee_target:      0.05
      d_push:           0.05
      w_ee_approach: 10000.0
      w_torque:         0.005

  # -----------------------------------------------------------------------
  # Task 3: Shepherding
  # -----------------------------------------------------------------------
  shepherding:
    object_type: sphere
    link_name: ball_link
    mass: 0.15
    friction: 0.3
    pusher_friction: 1.0
    radius: 0.06
    # 2026-07-28 frame migration (see pushing block; 0.45 per 2026-07-28b).
    init_xyz: [0.45, 0.0, 0.06]
    goal_xy:  [0.60, 0.0]
    goal_yaw: 0.0
    color_rgba: [0.2, 0.8, 0.2, 1.0]
    cost:
      w_obj_xy:    120000.0
      w_obj_z:         15.0
      w_box_z:         80.0
      w_box_rp:        40.0
      w_yaw:            0.0
      w_terminal:       5.0
      z_ee_target:      0.06
      d_push:           0.06
      w_ee_approach: 8000.0
      w_torque:         0.01

  # -----------------------------------------------------------------------
  # Task: push_t — reference push_t.sdf T-shape, single-body-collapsed.
  # Reference: examples/sampling_c3/urdf/push_t.sdf + push_t/parameters/.
  # Two 0.16×0.04×0.04 box collision elements welded via fixed joint at
  # (0,0,0) and (-0.10,0,0,0,0,π/2) in the reference frame; the port uses one
  # rigid link with those two collision elements (dynamically equivalent to
  # a fixed joint). Combined CoM at (-0.05,0,0) in the reference frame; the
  # port re-parameterizes so the link origin sits AT the combined CoM, moving
  # both bar collision poses by +0.05 along x.
  #
  # Friction: reference push_t.sdf has T μ=0.3, EE μ=1.0. Drake combines
  # per-surface μ via harmonic mean (μ_eff = 2·μ_A·μ_B/(μ_A+μ_B)), so the
  # reference EE-T μ_eff = 2·0.3·1.0/(1.3) = 0.462 (NOT 1.0 as prior comment
  # stated). Setting T μ=0.3 reproduces both the reference EE-T μ_eff AND
  # brings T-Table μ_eff from 1.0 to 0.462 (was blocking T motion — 9.8N
  # friction resistance was more than 4-6N push force). Ground pair no longer
  # a "documented fidelity boundary" — 0.462 matches reference within
  # single-surface constraints of Drake's model.
  #
  # Goal is a POSE target (position + yaw) — this task demonstrates the
  # paper's headline capability the cube literally cannot: pushing to a yaw
  # target on a non-yaw-symmetric object. w_yaw is dominant.
  push_t:
    object_type: tshape
    link_name: t_link
    mass: 1.0             # kg — matches reference (2 × 0.5 kg links)
    friction: 0.3         # μ_T (reference push_t.sdf drake:mu_dynamic); EE-T μ_eff=0.462
    pusher_friction: 1.0  # μ_EE (reference end_effector_full.urdf drake:mu_dynamic)
    # 2026-08-11 L4 (anything-N1 lineage): planner-LCS mu from the authors'
    # multiyaml_rewrite.py build_mu_per_pair_type constants — hardcoded for
    # EVERY anything object (not recomputed per material), so verbatim copy
    # is the authors' practice. Replaces the bit-rotted push_t literals
    # (EE-BOX 1.0 gave the planner 2.4x the sim's actual tangential grip —
    # Drake-combined 2*1.0*0.3/1.3 = 0.4615; the new 0.42 slightly
    # under-promises, the authors' own convention). Sim-side materials
    # (friction/pusher_friction above) unchanged.
    mu_per_pair_type:
      EE-BOX:  0.42
      BOX-GND: 0.46
      EE-GND:  0.823
    # Reference sim_params.yaml:15 q_init_object = [1,0,0,0, 0.5, 0, -0.009]
    # → T init at world (0.5, 0, -0.009) with reference ground at z=-0.029.
    # 2026-07-21: adopted reference-frame coordinates directly (was (0,0,0.02)
    # in the port's old y=-0.6 arm frame). Port ground at z=0 with arm at
    # z=0.029 → T CoM at z=0.02 (T half-height 0.02) is on ground.
    init_xyz: [0.5, 0.0, 0.02]
    # Reference target: fixed_target_position = [0.48199167, 0.18745379, -0.009]
    # fixed_target_orientation = [-0.9327733, 0, 0, 0.36046353].
    # Yaw = 2·atan2(0.36046353, -0.9327733) mod 2π = -0.73790 rad ≈ -42.28°.
    # 2026-07-21: adopted reference-frame absolute goal_xy directly.
    goal_xy:  [0.482, 0.187]
    goal_yaw: -0.7379    # rad = -42.28°, from reference push_t target quaternion
    color_rgba: [0.75, 0.75, 0.75, 1.0]
    # 2026-07-28c FRAME-SHIFT FIX (same family as the box-init bug): the
    # reference's sampling_height 0.005 (push_t/parameters/
    # sampling_params.yaml:5) is in ITS world, where the ground top sits at
    # z=-0.029 → the reference samples 34 mm ABOVE GROUND. Port ground top
    # is at z=0, so the verbatim 0.005 put samples 5 mm above ground: the
    # tip sphere (r=0.0195) would need 14.5 mm of table penetration, the
    # EE-center floor is 0.0195, and every reposition arrival plateaued at
    # finished_val 0.0204-0.0207 vs the 0.020 threshold (p133 audit).
    # 0.034 = the reference's own 34 mm, expressed in port coordinates.
    # The earlier "0.034 rides the T top corner" observation dates from the
    # r=0.025-pusher pre-conformance stack and was a stale-evidence revert.
    # PER-TASK VALUE — do not globalize. Each task sets its own height
    # (pushing 0.050 sub-CoM cube, hard_pushing 0.03, push_t 0.034); this
    # value OVERRIDES sampling_c3_kik_t.yaml `sampling_height` via
    # main.py:706-708 — the sampling-c3 yaml value is inert for push_t.
    sampling_height: 0.034
    # PWL waypoint height (sphere-center z) for the reposition trajectory's
    # traverse leg above the object. Must be > T_top + pusher_radius
    # (= 0.04 + 0.025 = 0.065) so the pusher sphere clears the T's top face
    # during over-object traverse. Reference push_t uses 0.06 above its
    # ground (z=-0.029), placing sphere-bottom 24 mm above T top — port
    # (ground at z=0) needs its own value.
    pwl_waypoint_height: 0.075   # T top 0.04 + pusher r 0.025 + 10 mm margin
    cost:
      # 2026-07-18: reference q_vector port available but currently disabled.
      # When `use_reference_q_vector: true`, control/task_costs.py
      # build_ee_space builds Q_base = w_Q · diag(q_vector) with the
      # reference's per-slot values from
      # push_t/parameters/sampling_c3_options.yaml:65-75, remapped into the
      # port's state layout. Disabled after empirical test in
      # results/push_t_T_qvec_20260718_005535: full reference q_vector
      # (velocity regularization on ang_vel, lin_vel, ee_vel slots) over-
      # damped the QP's dynamics — goal_dist 0.107→0.242, orient_err
      # 0.581→0.789 vs the simpler w_obj_xy=9000 fix (commit 7d11b98).
      # The reference's dense Q assumes an LCS whose velocity states behave
      # differently than the port's. Full structural adoption requires
      # porting the LCS state layout, not just the cost. Flag off by
      # default; individual w_obj_xy/w_obj_z/etc. below drive Q_base.
      #
      # default; individual w_obj_xy/w_obj_z/etc. below drive Q_base.
      #
      # 2026-07-22 qvector migration attempts (p39-p46) all diverged:
      #  - p39/p40/p41 (single-parameter): all regressed or blew up
      #  - p44 (full coordinated, admm_iter=3): 174.8mm trans, T over-pushed
      #  - p46 (full coordinated, admm_iter=25): dual explodes 1000×/solve
      # Root cause is structural (port scalar-ρ ADMM vs ref per-slot G).
      # Reverted to p38 config; qvector migration requires G-matrix port.
      use_reference_q_vector:  true
      # 2026-08-11 L3 (anything-N1 lineage, docs/anything-n1-config-delta-audit.md):
      # dual-regime Q exactly as multiyaml_rewrite.py build_q_vector emits —
      # FAR (position regime): w_Q_position 50 x q_vector_position
      #   (quat weights ZERO — orientation ignored until 5 cm out);
      # NEAR (pose regime, crossed_switching_threshold): w_Q 80 x q_vector
      #   (quat slots overridden by the 1000x quaternion Hessian, which the
      #   reference does NOT scale by w_Q — cc:1582-1590).
      # ee_vel [15,15,10] is the reference literal for BOTH regimes; the old
      # [5,5,5] was a deliberate p108 port deviation, retired here.
      w_Q:                    80.0
      w_Q_position:           50.0
      q_vector_ee_pos:        [0.01, 0.01, 0.01]
      q_vector_obj_quat:      [0.1, 0.1, 0.1, 0.1]
      q_vector_obj_pos:       [150.0, 150.0, 120.0]
      q_vector_position_obj_quat: [0.0, 0.0, 0.0, 0.0]
      q_vector_position_obj_pos:  [200.0, 200.0, 120.0]
      q_vector_ee_vel:        [15.0, 15.0, 10.0]
      q_vector_obj_ang_vel:   [0.05, 0.05, 0.05]
      q_vector_obj_lin_vel:   [0.05, 0.05, 0.05]
      # R = w_R x diag(r_vector) (both regimes; anything-N1 literals). The
      # z-axis EE force is penalized 100x the horizontal — was flat
      # w_torque*I = 0.01*I (the stale product 1 x [0.01,0.01,0.01]).
      w_R:                    6.0
      r_vector:               [0.01, 0.01, 1.0]
      # 2026-07-22 xy bumped to reference parity. Reference push_t
      # sampling_c3plus_options.yaml position regime: q_vector_position[8:10]=250
      # × w_Q=50 = 12500 per axis. Port was 9000 (~72% of ref). p43 diagnosis:
      # planner commanded 0.72N west push against 4.53N static-friction
      # threshold on 1kg T (μ=0.462) — insufficient because Q_xy gradient too
      # weak. Matches the z-tracking fix pattern (position regime target 12500).
      w_obj_xy:     12500.0
      w_obj_z:         10.0
      # 2026-07-22 z-tracking bumped to reference parity. Reference push_t
      # sampling_c3plus_options.yaml position regime: q_vector_position[10]=250
      # × w_Q=50 = 12500 obj_z weight. Port was w_obj_z + w_box_z = 10 + 100
      # = 110 (~113× underweight) — insufficient gradient in z direction to
      # prevent z-drift near goal (identified 2026-07-22 cost audit against
      # ref, item #2). Set w_box_z so w_obj_z + w_box_z = 12500.
      w_box_z:      12490.0
      # Reference goal_params.yaml:14 ee_target_z_offset_above_object.
      # When > 0, build_ee_space sets x_ref[EE_pos] = obj_curr_xyz +
      # [0, 0, ee_target_z_offset] with Q[EE_pos] = w_Q * q_vec_ee_pos,
      # matching franka_sampling_c3_controller.cc:440 target_state_mux
      # port 0 semantics. Pulls the arm to hover above the T center as
      # the T moves, preventing lateral drift near-goal that pushes
      # T out of the tight_goal region.
      ee_target_z_offset_above_object: 0.06
      # Near-goal (pose regime) obj-position weight overrides. Ported from
      # reference push_t sampling_c3plus_options.yaml — reduces obj_pos xy
      # by 0.80 and z by 0.48 when the wrapper's crossed_switching_threshold
      # latches (obj-to-goal < cost_switching_threshold_distance = 0.05 m).
      # Rationale: at pose regime the quaternion Hessian (line 213-222) drives
      # yaw; keeping obj_pos xy weight at 9000 there would let translation
      # compete with the yaw correction. Same 0.80/0.48 ratio the box config
      # (tasks.yaml:62-63) uses. task_costs.py:build_ee_space applies the
      # swap; the legacy build() path already had it.
      # 2026-07-22 pose xy bumped to reference parity (p47).
      # Reference push_t q_vector[8:10]=200 × w_Q=50 = 10000 per axis pose.
      # Ratio to position regime preserved (10000/12500 = 0.80).
      w_obj_xy_pose: 10000.0  # 12500 × 0.80, matches ref pose q_vec[8:10]×w_Q
      # 2026-07-22 pose-regime z bumped to reference parity. Reference push_t
      # sampling_c3plus_options.yaml pose regime: q_vector[10]=120 × w_Q=50 =
      # 6000 obj_z weight. Port was w_obj_z + w_box_z_pose = 10 + 48 = 58
      # (~103× underweight). Set w_box_z_pose so w_obj_z + w_box_z_pose = 6000.
      # Ratio to position regime (6000/12500=0.48) preserved.
      w_box_z_pose: 5990.0     # sum=6000, matches ref pose q_vec[10]×w_Q
      # 2026-07-22 roll/pitch reduced 50 → 5 for reference parity. Reference
      # sampling_c3plus_options.yaml q_vector[1:3]=[0.1, 0.1] × w_Q=50 = 5.0
      # per quat-roll and quat-pitch axis. Port used 50 (10× overweight);
      # applied at task_costs.py:825-826 in build_ee_space's Q assembly.
      # Note: near-goal, the quaternion Hessian override at line 911 wipes
      # this via Q[0:4,0:4] = Q_quat, so this term only fires far-goal
      # during transit; reducing it should let the T float more freely on
      # roll/pitch without giving up ground contact (z-tracking now =12500).
      w_box_rp:         5.0
      # 2026-07-22 removed port-only linear rank-1 yaw form. Reference
      # (sampling_c3plus_options.yaml + sampling_based_c3_controller.cc:1517-1570)
      # has NO linear yaw cost — yaw is entirely driven by the near-goal
      # quaternion-dependent Hessian override (weight=1000, fires at
      # goal_dist < cost_switching_threshold_distance = 0.05 m). Port had
      # w_yaw=800 outer(cy,cy) on Q[0:4,0:4] as a far-goal driver; removed
      # so yaw is Hessian-only, matching reference.
      w_yaw:            0.0
      # Near-goal hessian-quaternion Q_block (reference push_t
      # sampling_c3plus_options.yaml:74-75 and
      # sampling_based_c3_controller.cc:1517-1570). When the wrapper's
      # crossed_switching_threshold latches (obj-to-goal < 0.05m), the
      # linear w_yaw quat block is REPLACED by the Hessian of squared
      # quaternion-angle-difference cost. Linear form saturates near
      # goal (dcost/dpsi → 0 as psi → 0); hessian form has non-zero
      # curvature at the optimum, so the planner keeps driving yaw
      # error down.
      use_quaternion_dependent_cost:                    true
      q_quaternion_dependent_weight:                    1000.0
      # 2026-07-27: 0.1 → 0.0 (exact reference,
      # sampling_c3plus_options.yaml). The 0.1 was a port-side hedge from
      # the p63/64 era (pre-arc-2 stack, G-off, EE-space) where 0.0 alone
      # regressed trans. On the R^7 conformant stack (G-on, reference Q
      # chain, gravity-centered u-box) the hedge is unjustified; the
      # regularizer dilutes the quat Hessian's yaw-driving curvature —
      # p112 rot diagnosis flags every dilution of yaw authority.
      q_quaternion_dependent_regularizer_fraction:      0.0
      # w_terminal for the tshape path was formerly hardcoded to 1.0 (QN=Q)
      # inside task_costs.py:1076 to match reference gamma=1.0 — so the old
      # yaml value of 5.0 here was DEAD. That special-case was removed
      # 2026-07-20; the yaml value is now live. Reference behavior is
      # w_terminal:1.0.
      #
      # Tuning history:
      #   1.0  → reference; goal_dist=9.6mm / orient_err=7.2° with Fix A.
      #   20.0 → over-committed terminal pull; caused 100-s mid-run stall
      #          at goal_dist≈70mm (regressed to 25.7mm / 11.4°). Reverted.
      w_terminal:       1.0
      # 2026-07-19 z_ee_target 0.034 → 0.005. The old 0.034 came from an
      # earlier mistaken frame-offset argument (see sampling_c3_kik_t.yaml
      # :322 comment) that also broke sampling_height, which was later
      # fixed to 0.005 but z_ee_target was left stale. The comment on this
      # block (line 41-45 of pushing task) explicitly says z_ee_target
      # must match sampling_height so the planner's EE-cost target
      # agrees with the reposition tracker + kRandomOnPerimeter
      # target z. Under the mismatch the planner drove arm to z=0.034
      # while repos drove it to z=0.005, producing conflicting z-targets
      # in the C3+ solve.
      # 2026-08-02 (user-directed height unification): 0.005 → 0.034. The
      # 2026-07-28c frame-shift fix moved sampling_height 0.005 → 0.034
      # but left this stale AGAIN (same family). Inert on the active path
      # (use_reference_q_vector: true retires the proxy branch; only
      # PORT_EE_Z_HOLD fallback + evaluation-only ManipulationCost read
      # it) — aligned to the task height to defuse the trap.
      z_ee_target:      0.034
      z_obj_target:     0.020   # T stays on ground (reference target z = init z)
      d_push:           0.05
      w_ee_approach: 8000.0
      w_torque:         0.01

  # -----------------------------------------------------------------------
  # Task 3b: Push H — low-CoM H, PURE TRANSLATION
  # -----------------------------------------------------------------------
  # Object is dimensionally conformant to the reference H_shape_texture
  # (envelope 0.112 x 0.128 x 0.032 m, mass 1.0 kg, mu_dynamic 0.3, identical
  # hydroelastic block) but with the CoM deliberately dropped to 25% of height
  # (8 mm above the base) instead of the reference's geometric centre. See
  # sim/env_builder.py `_hshape_sdf` for the full rationale.
  #
  # goal_yaw 0.0 makes this a PURE-TRANSLATION task by design. push_t showed
  # rotation converging to the tight band reliably while translation asymptotes
  # ~0.107-0.115 m; isolating translation removes the rotation term that
  # dominates the sample-ranking cost and lets the translation behaviour be
  # measured on its own.
  #
  # goal_xy matches push_t's so closure is directly comparable (0.188 m).
  push_h:
    object_type: hshape
    link_name:   h_link
    # 0.05 kg is the SIMULATED mass of the reference H
    # (urdf/H_shape_texture/H_shape_texture.sdf <mass>0.05</mass>).
    # CORRECTION 2026-08-10: this was 1.0 kg, which I took from
    # H_shape_texture_CONTROLLER.sdf -- the controller model, not the
    # simulated object. Every mesh object in the reference library carries
    # that 20x split (sim 0.05 kg / controller 1.0 kg); push_t.sdf is the sole
    # object that is 1.0 kg in BOTH, which is why push_t's mass is correct.
    # Faithful would additionally give the CONTROLLER plant 1.0 kg; the port
    # has a single mass for both, so this sets the simulated value only.
    #
    # Stiction consequence: mu_comb 0.4615 -> mu*m*g = 0.226 N at 0.05 kg,
    # vs 4.53 N at 1.0 kg. Measured delivered force is ~1.6 N, so a 0.05 kg
    # object should slide with ~7x margin instead of creeping.
    mass:        0.05
    friction:    0.3        # reference drake:mu_dynamic
    com_height_frac: 0.25   # LOW CoM (reference = 0.5 = geometric centre)
    pusher_friction: 1.0
    mu_per_pair_type: {EE-BOX: 1.0, BOX-GND: 0.4615, EE-GND: 0.4165}
    # H spans z in [-0.016, +0.016] in link frame -> init z = 0.016 rests it
    # exactly on the table.
    init_xyz:  [0.5, 0.0, 0.016]
    goal_xy:   [0.482, 0.187]
    goal_yaw:  0.0
    color_rgba: [0.20, 0.45, 0.85, 1.0]
    # Pusher sphere r=0.0195 must clear the table, so the EE centre cannot go
    # below ~0.0205. 0.021 is as low as the push can be applied, which keeps the
    # tipping moment about the leading bottom edge as small as the geometry
    # allows (push 13 mm above the 8 mm CoM).
    sampling_height:     0.034   # ref anything 0.005 + 0.029 frame shift
    pwl_waypoint_height: 0.075
    cost:
      use_reference_q_vector: true
      w_Q: 50.0
      q_vector_ee_pos:      [0.01, 0.01, 0.01]
      q_vector_obj_quat:    [0.1, 0.1, 0.1, 0.1]
      q_vector_obj_pos:     [200.0, 200.0, 120.0]
      q_vector_ee_vel:      [5.0, 5.0, 5.0]
      q_vector_obj_ang_vel: [0.05, 0.05, 0.05]
      q_vector_obj_lin_vel: [0.05, 0.05, 0.05]
      w_obj_xy:      12500.0
      w_obj_z:          10.0
      w_box_z:       12490.0
      ee_target_z_offset_above_object: 0.06
      w_obj_xy_pose: 10000.0
      w_box_z_pose:   5990.0
      w_box_rp:          5.0
      w_yaw:             0.0
      use_quaternion_dependent_cost: true
      q_quaternion_dependent_weight: 1000.0
      q_quaternion_dependent_regularizer_fraction: 0.0
      w_terminal:        1.0
      z_ee_target:     0.034   # matches sampling_height
      z_obj_target:    0.016   # H rests at z = half-height
      d_push:          0.05
      w_ee_approach: 8000.0
      w_torque:        0.01

  # -----------------------------------------------------------------------
  # Task 4: Cube Turning (Jin & Posa eq. 40 analog)
  # -----------------------------------------------------------------------
  # Pure-rotation testbed. Translation weight w_obj_xy zeroed so the
  # orientation cost dominates. Goal yaw +45 deg (pi/4) — moderate, well
  # within the half-angle metric's monotonic range. Validates that the
  # planner can plan rotation now that the cost has a yaw target.
  cube_turning:
    object_type: box
    link_name: box_link
    mass: 0.2
    friction: 0.3
    pusher_friction: 1.0
    size: [0.1, 0.1, 0.1]
    # 2026-07-28 frame migration (see pushing block; 0.45 per 2026-07-28b).
    init_xyz: [0.45, 0.0, 0.05]
    goal_xy:  [0.45, 0.0]
    goal_yaw: 0.7854        # +45 deg = pi/4
    color_rgba: [0.8, 0.6, 0.2, 1.0]
    cost:
      w_obj_xy:         0.0   # translation weight zeroed (Jin & Posa wc=[10,0,2])
      w_obj_z:         10.0
      w_box_z:        100.0
      w_box_rp:        50.0
      w_yaw:           10.0   # orientation dominant
      w_terminal:       5.0
      z_ee_target:      0.05
      d_push:           0.05
      w_ee_approach: 8000.0
      w_torque:         0.001

  # ---------------------------------------------------------------------
  # push_jack — reference `jacktoy` family (examples/sampling_c3/jacktoy).
  #
  # THE ONLY SE(3) TASK IN THE PORT. Every other task rests on a flat face,
  # so its reachable pose set is {position} x {yaw} and a scalar goal_yaw
  # suffices. The jack is a caltrop: three mutually orthogonal capsules that
  # balance on a tripod of tip spheres and reorient by ROLLING onto a
  # different tripod. Its goal orientation tilts out of the plane and is not
  # any yaw, so it uses goal_quat (and main.py's SE(3) branches).
  #
  # Geometry/mass from urdf/jack.sdf (the SIM model): 3 capsules, r=0.025,
  # l=0.125, 0.052 kg each. Note urdf/jack_control.sdf — the model the
  # reference CONTROLLER plans with — declares 0.33 kg per capsule (0.99 kg
  # total, 6.35x heavier). The port runs ONE plant for sim and control, so it
  # cannot hold both; it uses the SIM mass, the same choice made for push_h.
  #
  # Frame: reference ground top is z=-0.029, port ground is z=0, so every
  # reference z here is shifted +0.029.
  # ---------------------------------------------------------------------
  push_jack:
    object_type: jack
    link_name: jack_link
    mass: 0.156              # 3 x 0.052, urdf/jack.sdf (SIM)
    # Reference plans with urdf/jack_control.sdf = 3 x 0.33 = 0.99 kg, 6.35x
    # the sim mass. Not cosmetic: at the sim mass the LCS predicts a phantom
    # LAUNCH (u=1 N across a 16 mm gap lifts the object 19.45 mm in the model,
    # 0.00 mm in reality) that swamps the 5.11 mm the real topple needs, so the
    # planner never plans the roll. At 0.99 kg the modelled launch is 0.00 mm.
    controller_mass: 0.99
    # Reference jacktoy/parameters/sim_params.yaml dt: 0.0001 -- 10x finer than
    # the port's historical 0.001. Matters here: the jack is 0.156 kg and the
    # measured contacts are 52 g impulses, which is what a coarse discrete step
    # produces when the planner drives the EE into a light object.
    sim_dt: 0.0001
    friction: 0.3            # jack.sdf drake:mu_dynamic
    pusher_friction: 1.0
    mu_per_pair_type:        # sampling_c3plus_options.yaml mu_per_pair_type
      EE-BOX:  1.0
      BOX-GND: 0.4615
      EE-GND:  0.4165

    # Resting CoM height = h/sqrt(3) + r = 0.0625/sqrt(3) + 0.025 = 0.061084,
    # the tripod rest. Reference goal_params resting_object_height 0.031971466
    # + 0.029 = 0.060971 -- agreement to 0.1 mm confirms the frame shift.
    init_xyz: [0.400, 0.300, 0.061084]
    # sim_params.yaml q_init_object[0:4] — an exact tripod rest (verified: the
    # three lowest tips agree to 2.7e-07 m; the 4th sits 72 mm clear).
    init_quat: [-0.3347435, -0.026718954, 0.8878204, 0.31518626]

    goal_xy: [0.450, 0.200]
    # goal_params.yaml fixed_target_orientation. Also an exact tripod rest,
    # but a DIFFERENT tripod: 97.0 deg of geodesic rotation from init, i.e.
    # the task cannot be solved without physically rolling the jack over.
    goal_quat: [0.8804762392171493, 0.27984814233312133,
                -0.3647051996310009, -0.11591689595929514]
    goal_yaw: 0.0            # inert — goal_quat takes precedence
    # Reference jacktoy goal_params.yaml goal_mode: 0 = kRandom — the goal
    # above is only the INITIAL goal (reference ctor cc:67-69 starts from
    # fixed_target_*); on success (xy < 0.02 AND geodesic < 0.1 rad,
    # goal_generator.cc:135-154) a new goal is drawn: x U[0.42,0.5],
    # y U[0.02,0.25], orientation = one of the 8 tripod rests x random
    # world yaw (>= 90 deg extra yaw when the tripod index repeats).
    # Implemented 2026-08-16 (JackRandomGoalGenerator); absent/kFixedGoal
    # keeps the single fixed goal (the pre-2026-08-16 port behavior).
    goal_mode: kRandom
    # User directive 2026-08-16: the random-quaternion chase IS the jacktoy
    # task. The reference boots from the fixed goal above and randomizes
    # only on success (verified: ctor cc:67-69, no init/radio events, and
    # the captured 180 s REF_jacktoy run holds ONE goal throughout) — but
    # its steady-state goal distribution is the random draw. With this key
    # goal #1 is drawn from that distribution at startup (seeded via
    # --seed), replacing the one-time fixed boot transient. false =
    # reference-literal boot.
    # Merge-back 2026-08-19: drawn-goal default RESTORED (the branch's
    # A/B eval protocol pinned false to boot at the reference fixed_target;
    # that protocol note lives in the eval logs and 4de4da3). To reproduce
    # the branch's canonical A/B numbers, set false.
    krandom_draw_initial_goal: true
    # User directive 2026-08-17: success = FLIPS. A goal is reached when the
    # jack's RESTING TRIPOD matches the goal's tripod (held 10 ticks);
    # position and yaw are ignored — replaces the reference gate pos<0.02
    # AND rot<0.1 (goal_generator.cc:135-154). Rationale: the burst push
    # primitive operates below the 55.3 mm tip-before-slide height, so the
    # reference gate is structurally unreachable for tripod-changing goals;
    # this makes the score measure the actual blocker (topple induction).
    # Draws avoid the current tripod so every goal demands a flip. Remove
    # the key (or set "reference") to restore the reference gate.
    # 2026-08-17 pt3 (user: "flip and translate/rotate in the same
    # time"): back to the FULL REFERENCE gate — pos<0.02 AND rot<0.1.
    # Now reachable: under the ref-validated recipe the emergent MPC
    # flips AND refines simultaneously (measured t=104s: 0.024m/0.196rad
    # vs the just-flipped-onto goal — the flip gate's early latch was
    # cutting off the refinement). flip mode remains available by
    # setting this back to: flip. flip_primitive below is inert under
    # reference mode (gated to flip mode in main.py).
    goal_success_mode: reference
    # User directive 2026-08-17 pt2: the CONTROLLER induces the flips
    # itself (no diagnostic external forces): a staged EE push primitive
    # at the toggling capsule's up-tip, goal-ward roll selection. Only
    # active under goal_success_mode: flip.
    flip_primitive: true

    color_rgba: [0.90, 0.45, 0.10, 1.0]
    sampling_height: 0.069   # 0.04 + 0.029; unused by kRandomOnSphere
    pwl_waypoint_height: 0.06   # reposition_params.yaml

    cost:
      # jacktoy/parameters/sampling_c3plus_options.yaml q_vector / w_Q.
      use_reference_q_vector: true
      w_Q: 45.0
      q_vector_ee_pos:      [0.01, 0.01, 0.01]
      q_vector_obj_quat:    [0.1, 0.1, 0.1, 0.1]
      q_vector_obj_pos:     [200.0, 200.0, 120.0]
      q_vector_ee_vel:      [5.0, 5.0, 5.0]
      q_vector_obj_ang_vel: [0.05, 0.05, 0.05]
      q_vector_obj_lin_vel: [0.05, 0.05, 0.05]

      use_quaternion_dependent_cost: true
      q_quaternion_dependent_weight: 2500.0     # jacktoy value (push_t: 1000)
      q_quaternion_dependent_regularizer_fraction: 0.0

      # --- the two SE(2) assumptions that MUST be disabled ---------------
      # w_box_rp penalizes roll/pitch away from upright. For a flat-resting
      # object that is a helpful regularizer; for the jack, roll and pitch
      # ARE the task -- a nonzero weight would penalize the 97 deg roll the
      # goal demands. w_yaw is the port-only rank-1 yaw form, meaningless for
      # an out-of-plane goal and would fight the quaternion Hessian.
      w_box_rp: 0.0
      w_yaw: 0.0

      w_obj_xy: 12500.0
      w_obj_z: 10.0
      w_box_z: 10.0            # NOT push_h's 12490: the jack's CoM height
                               # legitimately rises while it rolls over.
      w_obj_xy_pose: 10000.0
      w_box_z_pose: 10.0
      ee_target_z_offset_above_object: 0.06   # goal_params.yaml
      w_terminal: 1.0
      z_ee_target: 0.069
      z_obj_target: 0.061084
      d_push: 0.05
      w_ee_approach: 8000.0
      w_torque: 0.01

  # -----------------------------------------------------------------------
  # Task: push_t_mesh — the REFERENCE's maintained mesh-T (T_shape_video)
  # 2026-08-11 option-(a) migration: same task demand as push_t, but the
  # object is the anything pipeline's mesh asset (sim 0.05 kg, controller
  # model 1.0 kg — the reference's own 20x convention). Generated from the
  # push_t block; see push_t above for key rationale comments.
  # sampling_height 0.031 / pwl 0.0989 = anything z_height 0.002 /
  # pwl 0.0699 shifted from ref ground (-0.029) to port ground (0).
  # -----------------------------------------------------------------------
  push_t_mesh:
    object_type: tshape
    link_name: T_shape_video
    mass: 0.05
    friction: 0.3
    pusher_friction: 1.0
    mu_per_pair_type: {EE-BOX: 0.42, BOX-GND: 0.46, EE-GND: 0.823}
    # 2026-08-14 joint2 fix: same universal reference literal as `pushing`
    # (identical in anything/, push_t/, and jacktoy/ sim_params.yaml).
    # Required alongside the shared osc_franka.yaml W_joint2=1.0 pin —
    # without it the T task would pin to 1.1 rad from an IK-preposition
    # init far from 1.1 (the July "c3-entry arm slam" standing error).
    q_init_franka: [2.191, 1.1, -1.33, -2.22, 1.30, 2.02, 0.08]
    init_xyz: [0.5, 0.0, 0.0243]
    goal_xy: [0.482, 0.187]
    goal_yaw: -0.7379
    color_rgba: [0.75, 0.75, 0.75, 1.0]
    sampling_height: 0.031
    pwl_waypoint_height: 0.0989
    # T_shape_video is an ANYTHING-lineage object. Its reference sampler is
    # NOT PerimeterSampling: anything/parameters/sampling_params.yaml:14
    # sets sampling_strategy: 7 (kMeshNormalMultiObject; N=1 ≡ port
    # kMeshNormal) — area-weighted draws ON the mesh side walls, offset
    # buffer_distance along the face normal (generate_samples.cc:445-551).
    # The old analytic box-T face table was an unwitting imitation of this
    # (which is why it worked); PerimeterSampling was the wrong lineage
    # (the 2026-08-17 spin class). Literals below = the anything yaml.
    sampling_strategy: kMeshNormal
    sample_projection_clearance: 0.027
    buffer_distance: 0.035
    max_attempts: 100
    barycentric_bias: 1
    # anything grid literal (kept for reference/fallback if the strategy
    # is ever flipped back to kRandomOnPerimeter).
    grid_x_limits: [-0.11, 0.11]
    grid_y_limits: [-0.11, 0.11]
    cost:
      use_reference_q_vector: true
      w_Q: 80.0
      w_Q_position: 50.0
      q_vector_ee_pos: [0.01, 0.01, 0.01]
      q_vector_obj_quat: [0.1, 0.1, 0.1, 0.1]
      q_vector_obj_pos: [150.0, 150.0, 120.0]
      q_vector_position_obj_quat: [0.0, 0.0, 0.0, 0.0]
      q_vector_position_obj_pos: [200.0, 200.0, 120.0]
      q_vector_ee_vel: [15.0, 15.0, 10.0]
      q_vector_obj_ang_vel: [0.05, 0.05, 0.05]
      q_vector_obj_lin_vel: [0.05, 0.05, 0.05]
      w_R: 6.0
      r_vector: [0.01, 0.01, 1.0]
      w_obj_xy: 12500.0
      w_obj_z: 10.0
      w_box_z: 12490.0
      ee_target_z_offset_above_object: 0.06
      w_obj_xy_pose: 10000.0
      w_box_z_pose: 5990.0
      w_box_rp: 5.0
      w_yaw: 0.0
      use_quaternion_dependent_cost: true
      q_quaternion_dependent_weight: 1000.0
      q_quaternion_dependent_regularizer_fraction: 0.0
      w_terminal: 1.0
      z_ee_target: 0.034
      z_obj_target: 0.02
      d_push: 0.05
      w_ee_approach: 8000.0
      w_torque: 0.01
    object_sdf: sim/models/T_shape_video/T_shape_video.sdf
    controller_mass: 1.0
    # Declared planner tensor from the reference *_controller.sdf <inertial>
    # (NOT proportional to the sim tensor — see scripts/emit_controller_inertia.py).
    controller_inertia:
      mass: 1.0
      com: [0.0, 0.0, 0.0]
      moments: [0.003, 0.003, 0.006]
      products: [0.0, 0.0, 0.0]
    # Reference ground-witness triangle: the 3 corner-sphere centres from
    # T_shape_video_controller.sdf:289/300/311 (mesh-AABB bottom corners,
    # emitted by the reference controller_sdf_generation.py get_obj_corners()).
    # Replaces the port-computed bottom-slab extremity triangle (7a83bc2) —
    # a port-only substitute; this is the reference literal, same mechanism
    # as every auto-imported anything object below.
    ground_witness_points_body:
      - [-0.08161602, 0.08064646, -0.02428554]
      - [-0.08161602, -0.08665214, -0.02428554]
      - [0.13000116, -0.00300284, -0.02428554]

  # BLOCK-T (2026-08-17, user directive): the website's "Push T" object —
  # the reference push_t.sdf two-box T — loaded VERBATIM as reference
  # assets (byte-identical copies in sim/models/push_t_block/), replacing
  # the port-analytic _tshape_sdf build. Reference frame (vertical_link
  # origin at crossbar centre; stem welded at (-0.10,0,0)): the goal
  # literals below are the reference's own fixed_target for this body, so
  # no COM-frame shift correction applies. Sim mass == controller mass
  # (1.0 kg both SDFs) → no controller_mass/controller_inertia override;
  # the plant's weld composite IS the reference planning model. The
  # reference planner's EE-object pairs use vertical_link geometry only
  # (franka_sampling_c3_controller.cc:205-239) — the port's body-based
  # geom collection on link_name reproduces that exactly.
  push_t_block:
    object_type: tshape
    link_name: vertical_link
    mass: 1.0
    friction: 0.3
    pusher_friction: 1.0
    # Reference push_t demo planner-mu, INTENT variant (2026-08-17 μ trial):
    # the reference yaml's own comment says "match URDFs with
    # (2mu1*mu2)/(mu1+mu2)" — for these materials (EE 1.0, T 0.3) that is
    # 0.4615 — but its EE-T entry is 1.0, which matches the HARDWARE
    # rubber tip, not its sim. The 1.0 literal made the planner demand
    # tangential grip the sim cone cannot deliver: measured 10-30x
    # pusher-on-face slip, Ft/Fn saturated at 0.4615, ~10%-of-plan yield
    # per burst, 20-cycle endgame grind (blockT_retention_canon180).
    # Same literal-vs-intent precedent as the box 3-witness case.
    # Literal-1.0 run remains on record: tight PASS 0.0190/0.0887 @ df337c9.
    mu_per_pair_type: {EE-BOX: 0.4615, BOX-GND: 0.4615, EE-GND: 0.4165}
    q_init_franka: [2.191, 1.1, -1.33, -2.22, 1.30, 2.02, 0.08]
    init_xyz: [0.5, 0.0, 0.02]
    goal_xy: [0.482, 0.187]
    goal_yaw: -0.7379
    color_rgba: [0.75, 0.75, 0.75, 1.0]
    # Reference push_t sampling_params literals in port ground frame
    # (ref 0.005/0.06 above its z=-0.029 ground — see the push_t task's
    # frame-shift comments): sampling 0.034, pwl 0.075.
    sampling_height: 0.034
    pwl_waypoint_height: 0.075
    object_sdf: sim/models/push_t_block/push_t.sdf
    # Reference ground-witness triangle: the 3 sphere centres from
    # push_t_control.sdf:44-66 (vertical_link frame — top_left/top_right
    # on the stem's outer corners, bottom at the crossbar tip).
    ground_witness_points_body:
      - [-0.12, 0.08, -0.02]
      - [-0.12, -0.08, -0.02]
      - [0.08, 0.0, -0.02]
    # kRandom re-goaling draw box (reference push_t/goal_params.yaml:33-34
    # random_goal_x/y_limits). INERT unless goal_mode is kRandom (canonical
    # runs stay fixed-goal; enable via PORT_GOAL_MODE=kRandom).
    random_goal_x_limits: [0.44, 0.52]
    random_goal_y_limits: [0.02, 0.25]
    cost:
      use_reference_q_vector: true
      w_Q: 80.0
      w_Q_position: 50.0
      q_vector_ee_pos: [0.01, 0.01, 0.01]
      q_vector_obj_quat: [0.1, 0.1, 0.1, 0.1]
      q_vector_obj_pos: [150.0, 150.0, 120.0]
      q_vector_position_obj_quat: [0.0, 0.0, 0.0, 0.0]
      q_vector_position_obj_pos: [200.0, 200.0, 120.0]
      q_vector_ee_vel: [15.0, 15.0, 10.0]
      q_vector_obj_ang_vel: [0.05, 0.05, 0.05]
      q_vector_obj_lin_vel: [0.05, 0.05, 0.05]
      w_R: 6.0
      r_vector: [0.01, 0.01, 1.0]
      w_obj_xy: 12500.0
      w_obj_z: 10.0
      w_box_z: 12490.0
      ee_target_z_offset_above_object: 0.06
      w_obj_xy_pose: 10000.0
      w_box_z_pose: 5990.0
      w_box_rp: 5.0
      w_yaw: 0.0
      use_quaternion_dependent_cost: true
      q_quaternion_dependent_weight: 1000.0
      q_quaternion_dependent_regularizer_fraction: 0.0
      w_terminal: 1.0
      z_ee_target: 0.034
      z_obj_target: 0.02
      d_push: 0.05
      w_ee_approach: 8000.0
      w_torque: 0.01

  # ---- AUTO-IMPORTED anything objects (Fig 8 campaign 2026-08-15) ----
  I_shape_texture:
    # AUTO-IMPORTED anything object (scripts/import_anything_objects.py,
    # Fig 8 campaign 2026-08-15). mesh z: [-0.0258, 0.0262].
    object_type: tshape
    link_name: I_shape_texture
    mass: 0.05
    friction: 0.3
