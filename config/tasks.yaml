tasks:
  # -----------------------------------------------------------------------
  # Task 1: Standard Pushing
  # -----------------------------------------------------------------------
  pushing:
    object_type: box
    link_name: box_link
    mass: 0.2
    friction: 0.3            # reference push_t.sdf mu_dynamic
    pusher_friction: 1.0     # reference end_effector_full.urdf mu
    size: [0.1, 0.1, 0.1]
    init_xyz: [0.0, 0.0, 0.05]
    goal_xy:  [0.3, 0.0]
    goal_yaw: 0.0
    color_rgba: [0.8, 0.2, 0.2, 1.0]
    # D6: per-task push-point lowering. Sub-CoM contact (z=0.03 vs box CoM
    # at z=0.05) gives a restoring tip moment when the EE has any vertical
    # Reference push_t contacts object at ee_z = +14 mm above the object's
    # link-origin (world-z 0.005 vs object center at world-z -0.009 per
    # push_t/sim_params.yaml q_init_object). Port must MATCH this above-center
    # contact geometry to inherit the reference's stable rolling-contact
    # behavior — sub-center contact (previous 0.020 = 30 mm below center)
    # applies a torque in the wrong direction and 2x reference magnitude,
    # causing the 118° tumble observed in bug3_30s and prior runs.
    # Port box center at world-z 0.050 (init_xyz above + half-extent 0.05),
    # so +14 mm above center = world-z 0.064. Well within workspace_z_max.
    sampling_height: 0.064
    cost:
      w_obj_xy:    100000.0
      w_obj_z:         10.0
      w_box_z:        100.0
      w_box_rp:        50.0
      w_yaw:            0.0
      w_terminal:       5.0
      # z_ee_target: planner-cost proxy z (task_costs.py:349 proxy_3d.z
      # = self.z_ref). Must match sampling_height (0.064 above) so the
      # planner drives arm to the SAME z the reposition tracker + IK
      # place it at — +14 mm above box center = reference-conforming
      # contact geometry. Was 0.05 (box center) which caused the arm
      # to sink from sampling z=0.064 down to box-center z=0.05 during
      # c3 mode, then further to z=0.019 under the LCS lam_n pull.
      z_ee_target:      0.064
      d_push:           0.05
      w_ee_approach: 8000.0
      w_torque:         0.01
      # Near-goal (pose regime) overrides. Fire when the wrapper's
      # sticky `_crossed_switching_threshold` flag latches at
      # box-to-goal distance < cost_switching_threshold_distance (5 cm).
      # Ratios mirror reference push_t sampling_c3plus_options.yaml:
      #   position obj_pos = [250, 250, 250], pose obj_pos = [200, 200, 120]
      #   → 20 % xy reduction, 52 % z reduction near goal.
      w_obj_xy_pose: 80000.0    # 100k × 0.80
      w_box_z_pose:  48.0       # 100 × 0.48

  # -----------------------------------------------------------------------
  # Task 2: Hard Physics Pushing
  # -----------------------------------------------------------------------
  hard_pushing:
    object_type: box
    link_name: box_link
    mass: 1.5
    friction: 0.3
    pusher_friction: 1.0
    size: [0.1, 0.1, 0.1]
    init_xyz: [0.0, 0.0, 0.05]
    goal_xy:  [0.3, 0.0]
    goal_yaw: 0.0
    color_rgba: [0.2, 0.2, 0.8, 1.0]
    # D6: sub-CoM push point — see pushing task block above for rationale.
    sampling_height: 0.03
    cost:
      w_obj_xy:    150000.0
      w_obj_z:         10.0
      w_box_z:        100.0
      w_box_rp:        50.0
      w_yaw:            0.0
      w_terminal:       8.0
      z_ee_target:      0.05
      d_push:           0.05
      w_ee_approach: 10000.0
      w_torque:         0.005

  # -----------------------------------------------------------------------
  # Task 3: Shepherding
  # -----------------------------------------------------------------------
  shepherding:
    object_type: sphere
    link_name: ball_link
    mass: 0.15
    friction: 0.3
    pusher_friction: 1.0
    radius: 0.06
    init_xyz: [0.0, 0.0, 0.06]
    goal_xy:  [0.3, 0.0]
    goal_yaw: 0.0
    color_rgba: [0.2, 0.8, 0.2, 1.0]
    cost:
      w_obj_xy:    120000.0
      w_obj_z:         15.0
      w_box_z:         80.0
      w_box_rp:        40.0
      w_yaw:            0.0
      w_terminal:       5.0
      z_ee_target:      0.06
      d_push:           0.06
      w_ee_approach: 8000.0
      w_torque:         0.01

  # -----------------------------------------------------------------------
  # Task: push_t — reference push_t.sdf T-shape, single-body-collapsed.
  # Reference: examples/sampling_c3/urdf/push_t.sdf + push_t/parameters/.
  # Two 0.16×0.04×0.04 box collision elements welded via fixed joint at
  # (0,0,0) and (-0.10,0,0,0,0,π/2) in the reference frame; the port uses one
  # rigid link with those two collision elements (dynamically equivalent to
  # a fixed joint). Combined CoM at (-0.05,0,0) in the reference frame; the
  # port re-parameterizes so the link origin sits AT the combined CoM, moving
  # both bar collision poses by +0.05 along x.
  #
  # Friction: reference push_t.sdf has T μ=0.3, EE μ=1.0. Drake combines
  # per-surface μ via harmonic mean (μ_eff = 2·μ_A·μ_B/(μ_A+μ_B)), so the
  # reference EE-T μ_eff = 2·0.3·1.0/(1.3) = 0.462 (NOT 1.0 as prior comment
  # stated). Setting T μ=0.3 reproduces both the reference EE-T μ_eff AND
  # brings T-Table μ_eff from 1.0 to 0.462 (was blocking T motion — 9.8N
  # friction resistance was more than 4-6N push force). Ground pair no longer
  # a "documented fidelity boundary" — 0.462 matches reference within
  # single-surface constraints of Drake's model.
  #
  # Goal is a POSE target (position + yaw) — this task demonstrates the
  # paper's headline capability the cube literally cannot: pushing to a yaw
  # target on a non-yaw-symmetric object. w_yaw is dominant.
  push_t:
    object_type: tshape
    link_name: t_link
    mass: 1.0             # kg — matches reference (2 × 0.5 kg links)
    friction: 0.3         # μ_T (reference push_t.sdf drake:mu_dynamic); EE-T μ_eff=0.462
    pusher_friction: 1.0  # μ_EE (reference end_effector_full.urdf drake:mu_dynamic)
    init_xyz: [0.0, 0.0, 0.02]     # link origin at combined CoM; T half-height 0.02 → base on ground
    # Reference target — push_t/parameters/goal_params.yaml:30-31 frame-transformed.
    # Reference init T pose (sim_params.yaml:15): q_init_object = [1,0,0,0, 0.5, 0, -0.009]
    #   (identity orientation, world x=0.5, y=0, z=-0.009 with ref ground at z=-0.029).
    # Reference target: fixed_target_position = [0.48199167, 0.18745379, -0.009],
    #                   fixed_target_orientation = [-0.9327733, 0, 0, 0.36046353].
    # Relative displacement in ref: (target - init) = (-0.01801, +0.18745, 0).
    # Port init is at (0, 0, 0.02) with ground at z=0 → same relative displacement
    # applies. Yaw = 2·atan2(0.36046353, -0.9327733) mod 2π = -0.73790 rad ≈ -42.28°.
    goal_xy:  [-0.018, 0.187]
    goal_yaw: -0.7379    # rad = -42.28°, from reference push_t target quaternion
    color_rgba: [0.75, 0.75, 0.75, 1.0]
    # Contact regime matched to reference push_t/parameters/sampling_params.yaml:5
    # (sampling_height: 0.005 above ground). Port ground at world-z = 0, T body
    # sits on ground at CoM z=0.02 (T bottom at 0, top at 0.04). Pusher sphere
    # (r=0.025) at ee_z=0.005 extends z ∈ [-0.02, 0.03] — hits T side face
    # squarely across nearly its full 0-0.04 height. Prior value 0.034 was based
    # on a mistaken frame-offset argument and had the pusher center riding the
    # T top corner (ee_z ~0.06 during Drake contact events).
    # NOTE: This value OVERRIDES sampling_c3_kik_t.yaml `sampling_height` via
    # main.py:598-603 — the sampling-c3 yaml value is inert for push_t.
    sampling_height: 0.005
    cost:
      # 2026-07-18: reference q_vector port available but currently disabled.
      # When `use_reference_q_vector: true`, control/task_costs.py
      # build_ee_space builds Q_base = w_Q · diag(q_vector) with the
      # reference's per-slot values from
      # push_t/parameters/sampling_c3_options.yaml:65-75, remapped into the
      # port's state layout. Disabled after empirical test in
      # results/push_t_T_qvec_20260718_005535: full reference q_vector
      # (velocity regularization on ang_vel, lin_vel, ee_vel slots) over-
      # damped the QP's dynamics — goal_dist 0.107→0.242, orient_err
      # 0.581→0.789 vs the simpler w_obj_xy=9000 fix (commit 7d11b98).
      # The reference's dense Q assumes an LCS whose velocity states behave
      # differently than the port's. Full structural adoption requires
      # porting the LCS state layout, not just the cost. Flag off by
      # default; individual w_obj_xy/w_obj_z/etc. below drive Q_base.
      use_reference_q_vector:  false
      w_Q:                    45.0
      q_vector_ee_pos:        [0.01, 0.01, 0.01]
      q_vector_obj_quat:      [0.1, 0.1, 0.1, 0.1]
      q_vector_obj_pos:       [200.0, 200.0, 120.0]
      q_vector_ee_vel:        [5.0, 5.0, 5.0]
      q_vector_obj_ang_vel:   [0.05, 0.05, 0.05]
      q_vector_obj_lin_vel:   [0.05, 0.05, 0.05]
      w_obj_xy:      9000.0
      w_obj_z:         10.0
      w_box_z:        100.0
      w_box_rp:        50.0
      w_yaw:          800.0   # DOMINANT — the headline of this task
      # Near-goal hessian-quaternion Q_block (reference push_t
      # sampling_c3plus_options.yaml:74-75 and
      # sampling_based_c3_controller.cc:1517-1570). When the wrapper's
      # crossed_switching_threshold latches (obj-to-goal < 0.05m), the
      # linear w_yaw quat block is REPLACED by the Hessian of squared
      # quaternion-angle-difference cost. Linear form saturates near
      # goal (dcost/dpsi → 0 as psi → 0); hessian form has non-zero
      # curvature at the optimum, so the planner keeps driving yaw
      # error down.
      use_quaternion_dependent_cost:                    true
      q_quaternion_dependent_weight:                    1000.0
      q_quaternion_dependent_regularizer_fraction:      0.0
      w_terminal:       5.0
      z_ee_target:      0.034
      z_obj_target:     0.020   # T stays on ground (reference target z = init z)
      d_push:           0.05
      w_ee_approach: 8000.0
      w_torque:         0.01

  # -----------------------------------------------------------------------
  # Task 4: Cube Turning (Jin & Posa eq. 40 analog)
  # -----------------------------------------------------------------------
  # Pure-rotation testbed. Translation weight w_obj_xy zeroed so the
  # orientation cost dominates. Goal yaw +45 deg (pi/4) — moderate, well
  # within the half-angle metric's monotonic range. Validates that the
  # planner can plan rotation now that the cost has a yaw target.
  cube_turning:
    object_type: box
    link_name: box_link
    mass: 0.2
    friction: 0.3
    pusher_friction: 1.0
    size: [0.1, 0.1, 0.1]
    init_xyz: [0.0, 0.0, 0.05]
    goal_xy:  [0.0, 0.0]
    goal_yaw: 0.7854        # +45 deg = pi/4
    color_rgba: [0.8, 0.6, 0.2, 1.0]
    cost:
      w_obj_xy:         0.0   # translation weight zeroed (Jin & Posa wc=[10,0,2])
      w_obj_z:         10.0
      w_box_z:        100.0
      w_box_rp:        50.0
      w_yaw:           10.0   # orientation dominant
      w_terminal:       5.0
      z_ee_target:      0.05
      d_push:           0.05
      w_ee_approach: 8000.0
      w_torque:         0.001
