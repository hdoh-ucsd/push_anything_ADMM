# Configuration for sampling-C3 outer controller (Venkatesh et al. RA-L 2025).
#
# Field names mirror dairlib upstream
# (examples/sampling_c3/parameter_headers/{progress,sampling,reposition}_params.h
#  on branch hien/push_anything_with_nextgen_c3) verbatim.
#
# Default values are tuned for the push_anything_ADMM Python wrapper
# (Franka pushing a 0.2 kg box, dt_ctrl=0.01s, K=4 samples). Where they
# differ from upstream jacktoy defaults, the divergence is intentional
# and is noted inline.
#
# Pass to main.py as:  python main.py pushing --sampling-c3
# Or override path:    python main.py pushing --sampling-c3 path/to/file.yaml

# ----------------------------------------------------------------------------
# Project-specific weights (no upstream equivalent)
# ----------------------------------------------------------------------------

# Sample-cost alignment bonus: c_sample[i] -= w_align * max(0, n_hat_i · g_hat).
# PARTIAL-REVERT (w_align A/B verdict): w_align is FREE in the executor's
# early window (seeds 0/1) — the original ablation that called it "free"
# was measuring only that — but LOAD-BEARING at the dispatcher's LATE
# window on seeds 1/2: removing it produced a 2/3 catastrophic 24-26cm
# north-misdirection (wa0 obj_y=+0.239/+0.256 → wa30k obj_y=+0.006/+0.004).
# Mechanism is late-window dispatcher RANKING toward goal-aligned contacts
# (NOT early face-pick — early p_repos picks are byte-identical between
# w_align=0 and w_align=30000 across all 3 seeds).  Restored at 30000;
# seed-0 takes a 0.147→0.264 soft trade-off but the 2/3 catastrophic
# outcome avoidance dominates.
w_align:  0.0   # §9 Option B: reference has NO align_bonus. Removed for reference-faithful ranking. Was 30000.

# Cartesian travel penalty per metre on sample selection.
# 50 cm reposition costs +100 cost units, comparable to a few percent
# of typical c_C3 ~ 60000.
w_travel: 0.0   # §9 Option B: reference travel_cost_per_meter=0 for push_t+jack. Removed. Was 200.

# Reference alignment (§7.51 bank): matches ref LambdaEndEffectorW=diag(1,1,1).
# This is a default-changing edit: dataclass default is 100, ref-faithful is 1.
# Validated as load-bearing for the first box closure in §7.51 (with face-target
# and PUSHA_DISABLE_C3_OVERRIDE).
W_force: 1.0

# Component 1 conformance (push_anything_dev @ 257e3ed has no commit-face gate).
use_commit_face_gate: false

# T1b — reference 3-leg high-waypoint reposition (reposition.cc:394,
# RepositionPiecewiseLinear). Activates the Stage A `RepositionTrajectory`
# eval-based path (lift → traverse → descend at z_safe), replacing the
# legacy per-tick march. Matched pair with T1a's EE_z altitude gate:
# T1a says "don't dispatch c3 above the ceiling"; T1b makes the arm
# actually descend to below the ceiling so gated c3 dispatch can fire.
# pwl_waypoint_height set to reference push_t value (0.0774 m) in the
# reposition_params section below.
use_reposition_pwl_trajectory: true

# Rotation-aware sample bonus (L2.6 form):
#   c_sample[i] -= w_rot * |yaw_err| * max(0, M_z * yaw_sign)
# where M_z = (r x n_hat).z is the predicted contact moment about box CoM
# (n_hat = inward push, p_contact from sample geometry — L2.5), and
# yaw_sign = sign(goal_yaw - psi_now). The |yaw_err| factor makes the
# bonus track rotational urgency and self-attenuate near the goal.
# Magnitude derived from L2.5 measured data (current c_C3~12k vs strategy
# ~26k → gap ~14k; at |yaw_err|=π/4, m_z~0.025, w_rot=8e5 → bonus ~16k,
# enough to flip selection to the torque-producing off-center sample so
# kToC3ReachedReposTarget engages c3 on arrival).
# Gated on quad_cost.w_yaw > 0, so translation-only tasks see no effect.
w_rot:    0.0    # §9 Option B: reference has NO rot_bonus. Removed for reference-faithful ranking. Was 800000.

# Cheap-solve ADMM iters for the K-1 hypothetical evaluations.
# k=0 (current) always uses base_mpc.admm_iter (3 in production).
surrogate_admm_iters: 3

# §9 Option A — match reference push_t's 3 T-ground contact pairs
# (resolve_contacts_to_lists=[[0,1,3],[0,2,3]], num_contacts_index=0).
# When > 0, LCSFormulator synthesizes N manipuland-vertex ↔ ground contact
# rows (T-shape: 3 witnesses on the bottom face — crossbar tip + stem ±y
# tips) in addition to Drake's EE-manipuland admits. Drake's auto-admitted
# single BOX-GND pair is de-duplicated. This captures the T's distributed
# bottom-face friction so the planner's LCS models real torsional
# resistance to yaw (v5 root cause: single ground contact → 0 torsional
# resistance → planner predicts free yaw → tiny commanded λ_n → no push).
lcs_explicit_manipuland_ground_contacts: 3

# §9 Option B (Stage 2) — cost-LCS forward-sim ranking.
# When True, InnerSolver.evaluate_sample computes each sample's cost by
# forward-simulating the planner's u_seq under PD-with-feedforward on the
# LCS (LCP resolved per knot via PGS with Tikhonov reg), then scoring the
# simulated trajectory with an object-only quadratic cost. Mirrors reference
# TrajectoryEvaluator::SimulatePDControlWithLCS + CalcCost with cost_type=5
# (kSimImpedanceObjectCostOnly). Reference Kp_for_ee_pd_rollout=100 /
# Kd_for_ee_pd_rollout=0.5 from push_t/parameters/sampling_c3plus_options.yaml.
use_cost_lcs_ranking: true
Kp_for_ee_pd_rollout: 100.0
Kd_for_ee_pd_rollout: 0.5

# T-architecture rate decoupling (Stage 2b adds the machinery; Stage 2c
# flips values). At defaults dt_osc == dt_mpc so N_plan = 1 and the
# planner solves every OSC tick — pre-Stage-2b behavior preserved.
# Paper target: dt_osc ≈ 0.001 (1 kHz OSC), dt_mpc ≈ 0.025-0.143 (7-40 Hz MPC).
dt_osc: 0.01
dt_mpc: 0.01

# Stage 2 L1: goal-aligned contact-normal requirement at admission gate.
# Conformance landing (early_window verdict): entry-align gate is STRUCTURALLY
# BYPASSED at c3-admission (LCS has no EE-BOX pair at the admission tick, so
# wrapper.py:1084 is a no-op). Land 0.0 (uniform-conformance, no-op confirmed).
entry_align_threshold: 0.0


# ----------------------------------------------------------------------------
# Progress + mode-switch hysteresis
# ----------------------------------------------------------------------------

progress_params:
  # Which progress metric drives the timeout decision.
  # Valid: kC3Cost | kConfigCost | kPosOrRotCost | kPosOnly | kConfigCostDrop
  # kPosOnly: pushing-task variant; avoids the rot=0 OR-mask in kPosOrRotCost.
  track_c3_progress_via: kPosOnly

  # Number of control loops to wait before declaring "no progress" timeout.
  # §9 reference alignment: push_t/parameters/progress_params_c3plus.yaml
  #   uses 5 / 5 (not 60 / 30). Reference-verified divergence identified
  #   during the T-push tier-2 checklist audit.
  num_control_loops_to_wait:            5
  num_control_loops_to_wait_position:   5

  # Absolute-regression early-exit threshold (metres). When current pos_error
  # minus best pos_error exceeds this, dispatcher forces kToReposUnproductive
  # at wrapper.py:979 — regardless of variant or wait length. Catches
  # runaways by the box-moves-away signature, not by no-improvement tick
  # count. Pinned at CP1 of the combined-fix plan: gap analysis on
  # q5_head_default_noregress + q5_seed4_goal_reach gives [11mm wobble-max,
  # 35mm runaway-catch-max] -> midpoint 25mm. See
  # q6_combined_fix/CP1_threshold_pin.txt for full derivation.
  pos_regression_threshold:            0.025

  # kConfigCostDrop variant: required object-config cost drop over N loops.
  # §9 reference alignment: push_t/parameters/progress_params_c3plus.yaml uses
  # 0.01 (1% cost drop required) over 180 loops (not 0.0 over 30).
  progress_enforced_cost_drop:    0.01
  progress_enforced_over_n_loops: 180

  # When the box-to-goal distance falls below this, switch to the
  # _position hysteresis variants (typically tighter, since fine
  # placement is more sensitive than gross translation).
  cost_switching_threshold_distance: 0.05    # m

  # Reference-aligned arrival penalty (dairlib
  # sampling_based_c3_controller.cc:604-608 and 769-776).  Added to the
  # pursued repos slot's c_sample when the IK tracker reports the EE has
  # reached the target.  1e9 is the upstream value: large enough that
  # `repos_target_cost > finished_reposition_cost` distinguishes
  # arrival cleanly from raw-cost regimes (~165k–200k here).  Geometric
  # arrival therefore enters mode_switch as a soft cost penalty, not a
  # hard trigger — see mode_switch.decide_mode and reposition.py:246.
  finished_reposition_cost: 1.0e9

  # Absolute hysteresis values (used when use_relative_hysteresis is False).
  # Required cost gap (J_other - J_current) before a switch fires.
  hyst_c3_to_repos:              1000.0
  hyst_c3_to_repos_position:     5000.0
  hyst_repos_to_c3:              1000.0
  hyst_repos_to_c3_position:     5000.0
  hyst_repos_to_repos:            500.0
  hyst_repos_to_repos_position:  2500.0

  # Relative-hysteresis mode: gap is a fraction of the current cost.
  # Switched ON (was: false) because the original absolute hyst values
  # above (1000-5000) are ~150x smaller than typical c_sample magnitudes
  # in this task (~165k-200k), causing mode chatter every 1-2 loops.
  use_relative_hysteresis:                true
  # Bumped from the original seed (0.05/0.10) to upstream-jacktoy-like
  # magnitudes (0.30/0.50) after WEST v9 showed: descent needs ≥50 free-mode
  # steps to complete, but with frac=0.05 the kToC3Cost trigger fired every
  # ~30 steps, fragmenting free mode into incomplete descents. The new
  # values mean a ~50k cost gap (≈30% of 165k) is required to switch out.
  hyst_c3_to_repos_frac:                  0.95
  hyst_c3_to_repos_frac_position:         0.50
  # Repos→C3 hysteresis raised to 0.9 (push_t reference value) when
  # moving to the cost-based entry gate.  The dispatcher now applies the
  # fraction to best_other_cost (matching the reference at line 765), so
  # 0.9 means the current EE position must be ≤ 10% of the best other
  # sample's cost before the switch fires.  Stricter than the prior 0.30
  # used with the geometric-trigger gate.
  hyst_repos_to_c3_frac:                  0.9
  hyst_repos_to_c3_frac_position:         0.9
  # T-task override: reference push_t uses hyst_repos_to_repos_frac=0.30
  # (progress_params_c3plus.yaml:64) — a new sample must be ≥30% cheaper than
  # the current repos target to steal it. Reference-grounded fix for the
  # T's 250mm-spread sample distribution: box's 0.10 is too weak, letting
  # winner flip every tick (Diag 1: 768/801 kToBetterRepos events).
  hyst_repos_to_repos_frac:               0.30
  hyst_repos_to_repos_frac_position:      0.30

  # 9.4.7 Option A — 1d watchdog re-test under F2 regime (disabled by
  # default; set to a positive integer to enable). When > 0, the wrapper
  # forces "c3" mode once steps_since_improve ≥ this threshold, bypassing
  # cost-comparison hysteresis. Yesterday's 9.4.5-F set this to 100 and
  # was falsified because forced c3-mode received an empty LCS (Finding
  # A). F2 closed Finding A; the Option A re-test (threshold=100) showed
  # forced c3-mode now lands in non-empty LCS but the wrapper exits via
  # kToReposCost within 1 step on Path D (4 c3 steps / 800), so 1d does
  # not change verdict-A. See docs/step9_findings.md 9.4.7 Option A.
  watchdog_steps_since_improve_threshold: 0


# ----------------------------------------------------------------------------
# Sample generation
# ----------------------------------------------------------------------------

sampling_params:
  # Valid: kRadiallySymmetric | kRandomOnCircle | kRandomOnSphere | kFixed
  #        | kRandomOnPerimeter | kRandomOnShell | kMeshNormal | kFaceNormal
  # kFaceNormal = paper-faithful Push-Anything §IV-B1 sampler: sample on a
  # box face, project outward along the face normal by sampling_setback,
  # reject if still too close. Eliminates the ring-sampler's off-axis
  # interior samples (worst case θ=45° puts pusher 20.7 mm inside box).
  sampling_strategy: kFaceNormal

  # Number of additional samples beyond (current + previous-repos-target).
  num_additional_samples_c3:    3
  num_additional_samples_repos: 1

  # Sample buffer (replay-best-on-c3-exit hysteresis).
  consider_best_buffer_sample_when_leaving_c3: true
  N_sample_buffer:             5
  pos_error_sample_retention:  0.05    # m
  ang_error_sample_retention:  0.30    # rad

  # Number of control loops a random ring sample buffer persists before
  # being re-randomized. 0 disables (re-samples every loop — broken
  # behavior verified in results/random_ring_20260518_192051: box motion
  # 0 mm because IK tracker chases targets that jump 25+ cm/loop).
  # 30 ≈ 0.3 sec at dt_ctrl=0.01s, ~IK convergence time on the ring.
  # Buffer also force-refreshes on arrival (finished_repos fires) and
  # on mode transitions that change n_strategy.
  sample_buffer_lifetime:      30

  # Geometric parameters (interpretation depends on sampling_strategy).
  # T-shape overrides — see object_shape switch below.
  sampling_radius: 0.12         # m, candidate-ring radius approximating T's outer envelope
  repos_target_radius: 0.10     # m, IK proxy target — halfway between crossbar tip and stem back
  sampling_height: 0.034        # m, EE sphere-center world-z; matches reference push_t regime (34 mm above ground; port ground at world-z=0 vs reference ground at world-z=-0.029)

  # T-shape face table (Push-Anything §IV-B1 analog for the T).
  # The 8-patch table is hardcoded in sampling.py:_TSHAPE_FACE_TABLE — this
  # switch enables it. box_half_extent below is retained but unused when
  # object_shape=tshape (per-face half-lengths come from _TSHAPE_FACE_TABLE).
  object_shape:            tshape
  box_half_extent:         0.05    # m, retained for legacy readers; unused for tshape
  sampling_setback:        0.020   # m, reference push_t/parameters/sampling_params.yaml:15 (sample_projection_clearance=0.02)
  sample_reject_clearance: 0.005   # m, applied only for object_shape=box

  # Face-selection bias toward goal-aligned faces (Stage 2B infrastructure).
  # NEUTRALIZED 2026-06-01 after the β=2 sweep produced pre-registered
  # outcome 2: SC-modeB-convert PASSED (seeds 1,2 converted) but
  # SC-noregress-working FAILED on seeds 0/3/4 AND SC-noregress-lambda
  # FAILED on seed 3 (lcp_res_max p99=1.75e-5, λ_n max=66.5 — the
  # off-cardinal-contact regime cracks the projection, amending the
  # earlier "benign lambda" verdict to regime-dependent).
  # Infra retained (params.py field + sampling.py hook) for future redesign
  # once dispatcher distribution-sensitivity is /understood (H1/H2/H3
  # rescope).
  face_bias_strength:      0.0

  # T1c — kMeshNormal area-weighted face pick (reference
  # generate_samples.cc:454, barycentric_bias=1). When True, the face
  # selection in _face_normal_projection uses a categorical distribution
  # proportional to face area (large faces + top faces over-represented,
  # small side faces under-represented) instead of uniform-across-faces.
  # Uniform-within-face jitter is unchanged. Takes priority over
  # face_bias_strength (goal-align becomes a no-op when this is True).
  use_mesh_normal_area_weighting: true

  # Robot workspace bounds; samples failing this are pruned.
  # T-task: y_max raised to 0.30 to accommodate T-face samples on the +y stem
  # and crossbar-top faces once the T rotates (yaw target = +45° in this
  # task). Box-task y_max = 0.13 remains in the base sampling_c3_kik.yaml.
  workspace_xy_min: [-0.5, -0.7]
  workspace_xy_max: [ 0.5,  0.30]
  workspace_z_min:  0.02
  workspace_z_max:  0.30

  filter_samples_for_safety: true


# ----------------------------------------------------------------------------
# Reposition trajectory + tracking-PD law
# ----------------------------------------------------------------------------

reposition_params:
  # Valid: kStraightLine | kSawtoothLine | kPiecewiseLinear | kIK
  # Conformance landing: matches push_anything_dev's PiecewiseLinearTracker
  # (lift→traverse→descend in operational space, no per-knot IPOPT solve).
  # kIK was the project-specific extension with Ipopt FP-noise floor (52.6mm
  # same-seed spread per `project_ik_ipopt_nondeterminism_pinned`); kPWL is
  # the reference's tracker and matches push_anything_dev.
  traj_type: kPiecewiseLinear

  # Cartesian speed during reposition (translation rate of the EE).
  speed: 0.40    # m/s

  # Below this end-to-end Cartesian distance, skip the lift+traverse+descend
  # and run a direct straight-line in joint space. Avoids over-shoot for tiny
  # corrections.
  use_straight_line_traj_under_piecewise_linear: 0.008

  # Safe-height for the kPiecewiseLinear lift phase.
  #
  # T1b — reference push_t value (0.0774 m). Source:
  #   dairlib examples/sampling_c3/push_t/parameters/reposition_params.yaml
  #   reposition.cc:394 RepositionPiecewiseLinear pwl_waypoint_height=0.0774.
  # Puts sphere-center at 77.4 mm above ground = 37.4 mm above T top
  # (T half-height 0.02, T sits with base at ground so top at 0.04 m).
  # Was 0.15 (kept for the box path where 0.15 = 25 mm clearance over the
  # 0.10 m box top). The legacy horizon-budget note (0.40 m at N=20 × ds=0.02)
  # applies to the legacy IK-guide path only; the Stage A `RepositionTrajectory`
  # (activated by use_reposition_pwl_trajectory=true above) is eval-based
  # (returns p_des, v_des at sim_t) with no per-step horizon budget.
  pwl_waypoint_height: 0.0774   # m — reference push_t value

  # Per-leg Cartesian speed for the gated RepositionTrajectory PWL path
  # (Stage A, PUSHA_REPOSITION_PWL=1). Reference push_t value is 0.18 m/s
  # (dairlib examples/sampling_c3/push_t/parameters/reposition_params.yaml).
  # Kept separate from `speed` above: that one is the legacy IK tracker's
  # planning-lookahead stride; this one is the PWL's per-leg linear velocity.
  # Aligning to the reference eliminates the free-mode brush observed at
  # speed=0.40 (vz≈0.44 m/s past phi=6mm → Drake compliant contact yawed box).
  pwl_speed: 0.09    # P-A diagnostic: descend-velocity halved    # m/s

  # (other traj-type knobs left at defaults; ignored when traj_type=kPiecewiseLinear)
  use_straight_line_traj_under_spline: 0.12
  use_straight_line_traj_within_angle: 0.30
  spline_width:    0.17
  sphere_radius:   0.12
  circle_radius:   0.20
  circle_height:   0.00

  # Joint-space PD-with-grav-comp gains for tracking the per-step waypoint.
  # These come from the legacy free-mode controller; do NOT change without
  # re-validating EAST.
  Kp_q:          60.0
  Kd_q:          8.0
  Ki_q:          8.0
  I_max:         4.0   # reverted from 20.0; see results/imax_fix_north.log —
                       # the 20.0 value caused intermittent J2 saturation to
                       # return and slightly worsened landing. Residual is
                       # target-dynamics-bound, not cap-bound. Restored.
  torque_limit:  87.0
