# Operational Space Controller — reference-aligned gains.
#
# Sourced from dairlib push_anything_dev @ 257e3ed:
#   examples/sampling_c3/shared_parameters/osc_params.yaml
#
# All tasks (pushing, hard_pushing, shepherding, push_t, cube_turning)
# use these gains. Legacy port-tuned alternates (Kp=400/W_track=100) were
# removed as part of the reference-only cleanup.
osc:
  # Reference EndEffectorKp / EndEffectorKd.
  Kp_cart: [200.0, 200.0, 200.0]
  Kd_cart: [20.0,  20.0,  20.0]

  # Nullspace posture gains (reference relies on task + rotation-hold +
  # joint-2 pin for authority; nullspace posture is a weak anchor).
  Kp_null: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
  Kd_null: [3.0,  3.0,  3.0,  3.0,  3.0,  3.0,  3.0]

  # Reference w_elbow=1, elbow_kp=200, elbow_kd=10, target=1.1 rad
  # (osc_params.yaml:42-44 / franka_osc_controller.cc:159-165).
  #
  # Reference sends `panda_joint2_target = q_init_franka[1] = 1.1 rad`
  # continuously via LCM. In reference, arm INIT joint2 is 1.1 → zero
  # posture error and joint2 is pinned at that raised-shoulder pose,
  # matching reference's Franka mount (arm reaches down from a raised
  # platform onto the box/T). Port's Franka is welded at world origin
  # (not raised), so a raised-shoulder pose can't reach the low-z targets.
  # Port's INITIAL_ARM_Q[1]=0.675 is a different pose calibrated for the
  # port frame; setting target=1.1 pulled arm UP, setting target=0.675
  # PINNED arm at start pose (both prevent Cartesian z-descent to box).
  #
  # The joint2 posture cost is a REFERENCE FRAME-SPECIFIC compensation
  # that doesn't apply to the port's frame. Setting W_joint2=0 removes
  # it entirely — port relies on task tracking (Kp_cart=200) plus
  # nullspace posture (Kp_null=10) for arm posture, which is sufficient
  # without an over-strong elbow pin.
  # Re-enabled 2026-07-17: reference values w_elbow=1, elbow_kp=200,
  # elbow_kd=10, target=1.1 rad. Prior port ran W=0 per lock-in Option A
  # (memory: project_reproduce_dairlib_restored_main_joint2_flag) after
  # W=1/target=1.1 raised EE dramatically at commit ec7fc4a-era. Testing
  # under today's conformance stack (EE-chain, u_limits, z-freeze,
  # sampling_height=0.020) to see whether reference joint-2 target lifts
  # mid-arm links above box top and eliminates the arm-link-brushing
  # box-push observed on box_z020_063025 (81 n_pairs=2 events, 28mm
  # translation via arm links not pusher tip).
  Kp_joint2:         200.0
  Kd_joint2:          10.0
  # 2026-07-19: disable joint-2 posture cost. Reference frame's Franka
  # mount is at a raised platform where joint2 sits at ~1.1 rad in the
  # reach pose; port's Franka is welded at world origin, so IK-derived
  # runtime poses land joint2 near ~0.325 rad. With W_joint2=1.0 and
  # target=1.1 the posture cost injects `a_j2 = 200 × 0.775 = 155 rad/s²`
  # of upward acceleration on joint 2 at every c3-mode tick — the direct
  # cause of the c3-entry arm slam (arm swings up to z≈0.80 m before
  # descending). Documented in memory
  # project_reproduce_dairlib_restored_main_joint2_flag as "Option A".
  W_joint2:            0.0    # was 1.0 (ref w_elbow), OFF for port frame
  joint2_target_rad:   1.1    # (unused when W_joint2=0)
  joint2_idx:            1

  # Reference EndEffectorW = diag(1,1,1).
  W_track:   1.0
  # W_posture is a PORT-ADDED nullspace posture cost with no reference
  # equivalent. Reference OSC tracking data: EE-pos + joint2-pin +
  # EE-rot (inert) + EE-force — no general arm posture. Port's
  # W_posture=1.0 across all 7 arm joints fights task tracking (posture
  # is 7D vs task 3D) and pulled OSC to a low-|u| equilibrium ~90 mm
  # above the box target z. Disabled to match reference. Nullspace
  # DOFs still regularized weakly by W_acc=1e-7.
  W_posture: 0.0

  # Reference w_input = 0 → no input regularization.
  W_torque: 0.0
  # Reference w_accel · W_accel = 1e-5 · 0.01 = 1e-7 per axis.
  W_acc:    0.0000001

  # Reference osc_params.yaml:37 track_end_effector_orientation: false
  # → the reference OSC does NOT add an EndEffectorRot tracking data,
  # so the rotation cost never enters the QP even though EndEffectorRotW/
  # Kp/Kd are defined in the yaml. Port's W_rot=10 was a divergence
  # (port-only orientation-hold cost). Setting W_rot=0 removes the
  # cost entirely; Kp/Kd left non-zero as spec-comparable diagnostic.
  Kp_rot: [800.0, 800.0, 800.0]
  Kd_rot: [40.0,  40.0,  40.0]
  W_rot:  0.0

  # Per-joint torque limits (Franka URDF spec).
  tau_max: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]

  # Reference SetCmdAccelerationBounds (franka_osc_controller.cc:155-158,
  # osc_params.yaml `end_effector_acceleration: 10`). Clamps each axis of
  # a_des = Kp·p_err + Kd·v_err to ±10 m/s² before the OSC QP solves for
  # v̇. Without this cap, raw a_des reached -17 m/s² for p_err_z=-0.086,
  # driving arm through box target and tumbling it (24% torque saturation).
  end_effector_acceleration: 10.0
