# Operational Space Controller — gains for the Franka Panda arm.
#
# Drop-in replacement for the Aydinoglu impedance controller. The OSC
# solves a per-tick QP minimizing weighted (task tracking + posture +
# torque/accel regularization) subject to per-joint URDF torque limits.
#
# See control/osc/qp_builder.py for the cost/constraint definition,
# control/osc/operational_space_controller.py for the integration.

osc:
  # ----- Cartesian PD on EE position (3D) -----
  # Mirrors the impedance controller's tuned values (Kp_cart=400 N/m,
  # Kd_cart=40 N·s/m per axis). 1 cm error → 4 N task force request.
  # For the pusher's ~0.4 kg effective inertia, ~10 m/s² desired accel.
  # Critical damping at Kp=400 needs Kd ≈ 2·√(400·0.4) ≈ 25; 40 gives
  # a slight overdamping margin matching impedance's choice.
  Kp_cart: [400.0, 400.0, 400.0]   # N/m per axis
  Kd_cart: [40.0,  40.0,  40.0]    # N·s/m per axis

  # ----- Posture (nullspace) gains, per arm joint -----
  # Same as impedance's defaults. Joint-7 is gentlest because its 12 Nm
  # effort limit (vs 87 Nm on joints 1-4) saturates earlier; OSC's box
  # constraint handles this naturally so the values don't need joint-7
  # tapering as severely as the joint-PD law required.
  Kp_null: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
  Kd_null: [3.0,  3.0,  3.0,  3.0,  3.0,  3.0,  3.0]

  # ----- Joint-2 posture (dairlib parity — DEFAULT OFF post-recert) -----
  # Reference: franka_osc_controller.cc:159-165, osc_params.yaml:42-44 (weight 1).
  # Kp=200 / Kd=10 at target 1.1 rad, joint2_idx=1 = Franka joint 2.
  #
  # W_joint2 SET TO 0.0 on 2026-07-13 after the restored-main re-cert
  # (results/_recert_restored_main_box_seed0/VERDICT.md) showed that at
  # W=1 the pin yanks the EE from z=95mm to z=711mm in 1s during c3-mode
  # contact posture (a_j2 ≈ 200·(1.1 − q_j2) ≈ 120 rad/s² demanded → QP
  # satisfies via EE-upward accel → box translation halts).
  #
  # The code scaffolding STAYS available (qp_builder.py:215 gates on
  # W_joint2 > 0.0 so cost term is byte-inert here). Turn back on ONLY
  # inside a coupled cost-stack + executor re-tune conversation, where
  # the port's Q is being reshaped to work with reference-shaped OSC.
  # Piecewise adoption is what the recert falsified.
  Kp_joint2:         200.0
  Kd_joint2:          10.0
  W_joint2:            0.0
  joint2_target_rad:   1.1
  joint2_idx:            1

  # ----- QP cost weights -----
  # Task tracking dominates posture by 100× — the posture cost behaves as
  # a true null-space pull rather than fighting the task.
  W_track:   100.0
  W_posture:   1.0

  # Torque and accel regularization: tie-breakers in the QP's null space.
  # Keep small so they don't bias the solution; ensure the QP is strictly
  # convex (avoid OSQP "primal-dual infeasible" on degenerate problems).
  W_torque: 0.001
  W_acc:    0.001

  # ----- Per-joint torque limits (Franka URDF spec) -----
  # 87 Nm on joints 1-4 (shoulder/elbow), 12 Nm on joints 5-7 (wrist).
  # The impedance controller's uniform 30 Nm clip leaves joints 1-4
  # under-utilized AND joints 5-7 over-budget. URDF spec is the actual
  # hardware constraint.
  tau_max: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]
