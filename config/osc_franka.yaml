# Operational Space Controller — reference-aligned gains.
#
# Sourced from dairlib push_anything_dev @ 257e3ed:
#   examples/sampling_c3/shared_parameters/osc_params.yaml
#
# All tasks (pushing, hard_pushing, shepherding, push_t, cube_turning)
# use these gains. Legacy port-tuned alternates (Kp=400/W_track=100) were
# removed as part of the reference-only cleanup.
osc:
  # Reference EndEffectorKp / EndEffectorKd.
  Kp_cart: [200.0, 200.0, 200.0]
  Kd_cart: [20.0,  20.0,  20.0]

  # Nullspace posture gains (reference relies on task + rotation-hold +
  # joint-2 pin for authority; nullspace posture is a weak anchor).
  Kp_null: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
  Kd_null: [3.0,  3.0,  3.0,  3.0,  3.0,  3.0,  3.0]

  # Reference w_elbow=1, elbow_kp=200, elbow_kd=10, target=1.1 rad
  # (osc_params.yaml:42-44 / franka_osc_controller.cc:159-190: "the Franka
  # has 7 joints to control a 6 DOF EE command" — the const joint2 task is
  # the reference's redundancy anchor, and its Kd=10 is the ONLY damping
  # of the arm's 1-dim null space).
  #
  # 2026-08-14 RESTORED (W_joint2 0.0 → 1.0). The 2026-07-19 disable
  # rationale below cited the "raised mount / port frame" story, which the
  # 2026-07-28 mount close-out FALSIFIED (EE weld chain byte-identical →
  # the reference joint vector ports verbatim). The July harm ("c3-entry
  # arm slam", a_j2 = 200×0.775 rad/s²) was the 0.775-rad STANDING error
  # of pinning to 1.1 from the port's IK-preposition init (joint2≈0.33) —
  # the init mismatch, not the pin. Paired fix: tasks.yaml q_init_franka
  # starts the arm AT joint2=1.1 (reference sim_params.yaml:13), so the
  # pin is transient-free.
  #
  # Root-cause context (memory
  # project_box_park_rootcause_nullspace_orbit_2026-08-14): with
  # W_joint2=0 AND W_posture=0 the null space is unanchored and undamped;
  # QP dumps showed a persistent |v_arm|≈0.7 rad/s self-motion orbit
  # (joint2 sweeping 0.22→1.76 rad) that wanders the arm into real
  # arm-environment jams — the box endgame dead-park.
  Kp_joint2:         200.0
  Kd_joint2:          10.0
  W_joint2:            1.0    # reference w_elbow (restored 2026-08-14)
  joint2_target_rad:   1.1
  joint2_idx:            1

  # Reference EndEffectorW = diag(1,1,1).
  W_track:   1.0
  # W_posture is a PORT-ADDED nullspace posture cost with no reference
  # equivalent. Reference OSC tracking data: EE-pos + joint2-pin +
  # EE-rot (inert) + EE-force — no general arm posture. Port's
  # W_posture=1.0 across all 7 arm joints fights task tracking (posture
  # is 7D vs task 3D) and pulled OSC to a low-|u| equilibrium ~90 mm
  # above the box target z. Disabled to match reference. Nullspace
  # DOFs still regularized weakly by W_acc=1e-7.
  W_posture: 0.0

  # Reference w_input = 0 → no input regularization.
  W_torque: 0.0
  # Reference w_accel · W_accel = 1e-5 · 0.01 = 1e-7 per axis.
  W_acc:    0.0000001

  # The reference adds RotTaskSpaceTrackingData UNCONDITIONALLY
  # (franka_osc_controller.cc:171-187, EndEffectorRotW/Kp/Kd = 10/800/40,
  # osc_params.yaml:59-70). `track_end_effector_orientation: false`
  # (osc_params.yaml:37) gates ONLY the trajectory source:
  # end_effector_orientation.cc:49-57 emits a CONSTANT identity-quaternion
  # slerp when false, so the rotation-hold cost is in the reference QP in
  # every mode. 2026-07-28 defaults flip: W_rot = 10.0 is the DEFAULT
  # (was 0.0 behind REFCONF_OSC_EE_ROT_TASK). The port holds the
  # first-tick snapshot orientation — the port-frame analog of the
  # reference's identity target (ref EE tip is welded roll=π, so identity
  # = pusher-down there).
  Kp_rot: [800.0, 800.0, 800.0]
  Kd_rot: [40.0,  40.0,  40.0]
  W_rot:  10.0

  # Per-joint torque limits (Franka URDF spec).
  tau_max: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]

  # Reference SetCmdAccelerationBounds (franka_osc_controller.cc:155-158,
  # osc_params.yaml `end_effector_acceleration: 10`). Clamps each axis of
  # a_des = Kp·p_err + Kd·v_err to ±10 m/s² before the OSC QP solves for
  # v̇. Without this cap, raw a_des reached -17 m/s² for p_err_z=-0.086,
  # driving arm through box target and tumbling it (24% torque saturation).
  end_effector_acceleration: 10.0
