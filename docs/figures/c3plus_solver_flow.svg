<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">C3+ solver flow</title>
<desc id="desc">Current state and local LCS linearization feed a stacked C3+ QP; ADMM alternates a global QP update, componentwise complementarity projection, and dual and penalty updates.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 Z" fill="#5f6b7a"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="600" y="42.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#172033">
<tspan x="600" dy="0">C3+ inner solve for one local candidate</tspan>
</text>
<rect x="45" y="95" width="205" height="82" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="147.5" y="131.58" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#172033">
<tspan x="147.5" dy="0">Current state +</tspan>
<tspan x="147.5" dy="21.2">nominal reference</tspan>
</text>
<rect x="315" y="95" width="205" height="82" rx="9" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<text x="417.5" y="131.84" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033">
<tspan x="417.5" dy="0">Local LCS</tspan>
<tspan x="417.5" dy="20.0">A, B, D, d; E, F, H, c</tspan>
</text>
<rect x="585" y="95" width="230" height="82" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="700.0" y="131.84" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033">
<tspan x="700.0" dy="0">Stacked C3+ QP</tspan>
<tspan x="700.0" dy="20.0">η = Ex + Fλ + Hu + c</tspan>
</text>
<path d="M250,136 L315,136" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M520,136 L585,136" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="245" width="840" height="210" rx="12" fill="#fafafa" stroke="#6b7280" stroke-width="2"/>
<text x="215" y="277.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#172033">
<tspan x="215" dy="0">ADMM iterations</tspan>
</text>
<rect x="230" y="315" width="200" height="78" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="330.0" y="349.58" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#172033">
<tspan x="330.0" dy="0">Global z update</tspan>
<tspan x="330.0" dy="21.2">constrained QP</tspan>
</text>
<rect x="500" y="315" width="200" height="78" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="600.0" y="349.84" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033">
<tspan x="600.0" dy="0">Local δ update</tspan>
<tspan x="600.0" dy="20.0">componentwise (λ, η)</tspan>
</text>
<rect x="760" y="315" width="220" height="78" rx="9" fill="#dcfce7" stroke="#16803a" stroke-width="2"/>
<text x="870.0" y="350.1" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#172033">
<tspan x="870.0" dy="0">Consensus / dual update</tspan>
<tspan x="870.0" dy="18.8">ω and penalty scaling</tspan>
</text>
<path d="M430,354 L500,354" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700,354 L770,354" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M870,393 L870,430 L330,430 L330,393" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700,177 L700,245" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="520" width="235" height="82" rx="9" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<text x="447.5" y="556.84" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033">
<tspan x="447.5" dy="0">Final QP / trajectory</tspan>
<tspan x="447.5" dy="20.0">and candidate objective</tspan>
</text>
<rect x="655" y="520" width="215" height="82" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="762.5" y="556.5799999999999" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#172033">
<tspan x="762.5" dy="0">First MPC interval</tspan>
<tspan x="762.5" dy="21.2">to the executor</tspan>
</text>
<path d="M600,455 L475,520" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M565,561 L655,561" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="630.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5f6b7a">
<tspan x="600" dy="0">C3 and C3+ share the LCS, cost, and receding-horizon controller interfaces.</tspan>
</text>
</svg>
