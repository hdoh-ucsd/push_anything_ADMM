<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Research roadmap</title>
<desc id="desc">Completed reproduction scope, active comparison and contact-location investigations, and planned future work are separated.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 Z" fill="#5f6b7a"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="600" y="42.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#172033">
<tspan x="600" dy="0">Research scope and status</tspan>
</text>
<rect x="45" y="90" width="350" height="260" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="220" y="125.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563eb">
<tspan x="220" dy="0">CURRENT IMPLEMENTATION</tspan>
</text>
<circle cx="79" cy="175" r="5" fill="#2563eb"/>
<text x="100" y="180.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#172033">
<tspan x="100" dy="0">Push Anything reproduction</tspan>
</text>
<circle cx="79" cy="230" r="5" fill="#2563eb"/>
<text x="100" y="224.8" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#172033">
<tspan x="100" dy="0">Planar pushing + experimental</tspan>
<tspan x="100" dy="21.2">jack orientation task</tspan>
</text>
<circle cx="79" cy="285" r="5" fill="#2563eb"/>
<text x="100" y="290.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#172033">
<tspan x="100" dy="0">C3 / C3+ in PyDrake</tspan>
</text>
<rect x="425" y="90" width="350" height="260" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="600" y="125.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#ea580c">
<tspan x="600" dy="0">CURRENT RESEARCH</tspan>
</text>
<circle cx="459" cy="175" r="5" fill="#ea580c"/>
<text x="480" y="180.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#172033">
<tspan x="480" dy="0">CRISP comparison study</tspan>
</text>
<circle cx="459" cy="230" r="5" fill="#ea580c"/>
<text x="480" y="224.8" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#172033">
<tspan x="480" dy="0">Continuous contact-location</tspan>
<tspan x="480" dy="21.2">investigation</tspan>
</text>
<rect x="805" y="90" width="350" height="260" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="980" y="125.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#6b7280">
<tspan x="980" dy="0">PLANNED / FUTURE</tspan>
</text>
<circle cx="839" cy="175" r="5" fill="#6b7280"/>
<text x="860" y="169.8" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#172033">
<tspan x="860" dy="0">General 3D / SE(3)</tspan>
<tspan x="860" dy="21.2">non-prehensile manipulation</tspan>
</text>
<circle cx="839" cy="230" r="5" fill="#6b7280"/>
<text x="860" y="235.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#172033">
<tspan x="860" dy="0">Broader cube-object studies</tspan>
</text>
<circle cx="839" cy="285" r="5" fill="#6b7280"/>
<text x="860" y="290.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#172033">
<tspan x="860" dy="0">GPU acceleration</tspan>
</text>
<path d="M395,220 L425,220" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M775,220 L805,220" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="600" y="390.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5f6b7a">
<tspan x="600" dy="0">Roadmap items describe research direction, not completed benchmark claims.</tspan>
</text>
</svg>
