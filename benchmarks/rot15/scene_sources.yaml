  geometry_path: tools/scene_smoke/scene_configs/{scene}.yaml
  geometry_controller_path: systems/controllers/sampling_based_c3_controller.cc

# A task seed is intentionally a function of scene and start only.  The three
# relative-rotation conditions within a start triplet use the same seed, and
# C3+ and OIM use the exact same integer for a case.
seed_policy:
  base: 17000
  scene_stride: 100
  start_stride: 1
  rotation_affects_seed: false

rotations:
  - {label: rot000, id_suffix: rot000, delta_yaw_rad: 0.0, delta_yaw_deg: 0.0}
  - {label: rotCCW090, id_suffix: rotCCW090, delta_yaw_rad: 1.5707963267948966, delta_yaw_deg: 90.0}
  - {label: rotCW090, id_suffix: rotCW090, delta_yaw_rad: -1.5707963267948966, delta_yaw_deg: -90.0}

# Geometry is the exact orientation-aware representation used by the synced
# C3+ scene layer: each manipulated object is the union of the listed boxes;
# controller_boundary_10_subdivisions reproduces TFootprint/CFootprint's 11
# endpoint-inclusive samples per rectangle edge. Obstacles reproduce the
# exact AABB/convex-hull/disc overrides supplied by tools/scene_smoke/env_*.sh.
